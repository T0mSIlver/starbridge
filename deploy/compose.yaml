# Runs on starbridge-1 as `sudo docker compose -p starbridge -f /opt/starbridge/deploy/compose.yaml`.
# deploy/deploy.sh copies the repository to /opt/starbridge and builds the image there.
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
      # The commit, which /healthz names; deploy-rev.sh and deploy.sh set it.
      args:
        REVISION: ${REVISION:-unknown}
    image: starbridge-server:latest
    restart: unless-stopped
    # Built by deploy/host/server-env.sh from the secrets in /etc/starbridge/secrets.
    env_file: /etc/starbridge/server.env
    # Cloudflare's free proxy, the emergency switch in front of the box, ends a request at
    # 100 s: long-polls return within 90 (#799).
    environment:
      MAX_WAIT_SECONDS: "90"
    volumes:
      - data:/data
    # Only Caddy reaches the server.
    ports:
      - "127.0.0.1:8080:8080"
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  # Two copies of the page, swapped one at a time on each deploy (deploy/host/apply.sh); Caddy
  # sends requests to the first healthy one. Only Caddy reaches them; they hold no secrets. Their
  # one setting is the public origin, written into the install scripts they serve.
  web-a:
    build:
      context: ..
      dockerfile: web/Dockerfile
      # The public pages load Umami (below); a self-hosted build leaves it out.
      args:
        ANALYTICS: umami
    image: starbridge-web:latest
    restart: unless-stopped
    environment: &web-env
      PUBLIC_URL: https://starbridge.run
    ports:
      - "127.0.0.1:3010:3000"
    logging: *logging

  web-b:
    image: starbridge-web:latest
    pull_policy: never
    restart: unless-stopped
    environment: *web-env
    ports:
      - "127.0.0.1:3011:3000"
    logging: *logging

  # Umami, the cookieless analytics of the public pages (SPEC.md, "The hosted instance"). Caddy serves its
  # tracker script and collect endpoint under /stats; the dashboard is on 127.0.0.1:3001 only,
  # for the owner through an SSH tunnel.
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    # DATABASE_URL and APP_SECRET, made once by deploy/host/umami-env.sh.
    env_file: /etc/starbridge/umami.env
    environment:
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      # The visitor hash (IP, user agent, website) gets a new salt every day.
      SALT_ROTATION: day
    depends_on:
      umami-db:
        condition: service_healthy
    networks: [umami]
    ports:
      - "127.0.0.1:3001:3000"
    logging: *logging

  umami-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
    # POSTGRES_PASSWORD, from the same script.
    env_file: /etc/starbridge/umami-db.env
    volumes:
      - umami-db:/var/lib/postgresql
    networks: [umami]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  caddy:
    # Caddy with the rate_limit module (caddy.Dockerfile). apply.sh builds it only when no image
    # is tagged with a hash of that file: every input of the build stays in it.
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: starbridge-caddy:latest
    restart: unless-stopped
    # Host networking: Caddy sees real client IPv4 and IPv6 addresses, which the server's
    # per-IP rate limits read from X-Forwarded-For.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # What the Caddyfile imports from outside the repo: the stats password (host/caddy-auth.sh).
      - /etc/starbridge/caddy:/etc/caddy/secrets:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  data:
  caddy-data:
  caddy-config:
  umami-db:

# Umami and its database only see each other.
networks:
  umami:
