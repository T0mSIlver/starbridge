# Runs on starbridge-1 as `sudo docker compose -p starbridge -f /opt/starbridge/deploy/compose.yaml`.
# deploy/deploy.sh copies the repository to /opt/starbridge; host/apply.sh pulls the server and
# web images deploy.yml pushed for that commit and writes REVISION and their digests to .env
# beside this file. The
# build sections are for the load test (evals/load/stack.sh), which builds them itself.
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        REVISION: ${REVISION:-unknown}
    # By digest on the boxes (host/apply.sh writes SERVER_IMAGE and WEB_IMAGE); by tag elsewhere.
    image: ${SERVER_IMAGE:-ghcr.io/t0msilver/starbridge-server:${REVISION:?host/apply.sh writes it to deploy/.env}}
    restart: unless-stopped
    # Built by deploy/host/server-env.sh from the secrets in /etc/starbridge/secrets.
    env_file: /etc/starbridge/server.env
    # The launch watcher's counts, which name addresses, on the container's loopback only
    # (deploy/host/watch.sh). Cloudflare's free proxy, the emergency switch in front of the box,
    # ends a request at 100 s: long-polls return within 90 (#799).
    environment:
      # The deployed commit, which /healthz names: an image is reused for a later commit that
      # changed nothing it is built from (deploy.yml), so the one built into it can be older.
      STARBRIDGE_REVISION: ${REVISION:?host/apply.sh writes it to deploy/.env}
      WATCH_PORT: "8081"
      MAX_WAIT_SECONDS: "90"
      # The server posts the launch funnel's steps to Umami (server/src/funnel.ts); the id is
      # WEBSITE_ID in web/src/lib/analytics.ts.
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: f3741d82-c450-47d3-8845-646cddbe392f
    volumes:
      - data:/data
    # It writes only to /data (#1717): no capabilities, no setuid gains, the rest read-only.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [default, stats]
    # Only Caddy reaches the server.
    ports:
      - "127.0.0.1:8080:8080"
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  # Two copies of the page, swapped one at a time on each deploy (deploy/host/apply.sh); Caddy
  # sends requests to the first healthy one. Only Caddy reaches them; they hold no secrets. Their
  # one setting is the public origin, written into the install scripts they serve.
  web-a:
    build:
      context: ..
      dockerfile: web/Dockerfile
      # The public pages load Umami (below); a self-hosted build leaves it out.
      args:
        ANALYTICS: umami
    image: &web-image ${WEB_IMAGE:-ghcr.io/t0msilver/starbridge-web:${REVISION:?host/apply.sh writes it to deploy/.env}}
    restart: unless-stopped
    environment: &web-env
      PUBLIC_URL: https://starbridge.run
    ports:
      - "127.0.0.1:3010:3000"
    logging: *logging

  web-b:
    image: *web-image
    restart: unless-stopped
    environment: *web-env
    ports:
      - "127.0.0.1:3011:3000"
    logging: *logging

  # Umami, the cookieless analytics of the public pages (spec/hosted.md). Caddy serves its
  # tracker script and collect endpoint under /stats; the dashboard is on 127.0.0.1:3001 only,
  # for the owner through an SSH tunnel.
  umami:
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    restart: unless-stopped
    init: true
    # DATABASE_URL and APP_SECRET, made once by deploy/host/umami-env.sh.
    env_file: /etc/starbridge/umami.env
    environment:
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      # The visitor hash (IP, user agent, website) gets a new salt every day.
      SALT_ROTATION: day
    depends_on:
      umami-db:
        condition: service_healthy
    networks: [umami, stats]
    ports:
      - "127.0.0.1:3001:3000"
    logging: *logging

  umami-db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
    # POSTGRES_PASSWORD, from the same script.
    env_file: /etc/starbridge/umami-db.env
    volumes:
      - umami-db:/var/lib/postgresql
    networks: [umami]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  caddy:
    # Caddy with the rate_limit module (caddy.Dockerfile). apply.sh builds it only when no image
    # is tagged with a hash of that file: every input of the build stays in it.
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: starbridge-caddy:latest
    restart: unless-stopped
    # Host networking: Caddy sees real client IPv4 and IPv6 addresses, which the server's
    # per-IP rate limits read from X-Forwarded-For.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # What the Caddyfile imports from outside the repo: the stats password (host/caddy-auth.sh).
      - /etc/starbridge/caddy:/etc/caddy/secrets:ro
      - caddy-data:/data
      - caddy-config:/config
      # The admin API's socket (the Caddyfile's `admin`), which only root on the host can open.
      - /run/starbridge-caddy:/run/caddy-admin
    logging: *logging

volumes:
  data:
  caddy-data:
  caddy-config:
  umami-db:

# Umami and its database see each other; the server sees Umami alone.
networks:
  umami:
  stats:
