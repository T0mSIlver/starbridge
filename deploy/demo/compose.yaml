# The demo server for Play reviewers (#423), at https://demo.starbridge.run. A project of its
# own on sb-staging: `sudo docker compose -p starbridge-demo -f /opt/starbridge-staging/deploy/demo/compose.yaml`.
# Each staging deploy rebuilds it from its checkout (deploy/host/demo.sh, #1557).
services:
  demo:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
    image: starbridge-demo:latest
    restart: unless-stopped
    init: true
    # OWNER_TOKEN, copied by setup.sh from ~/.config/starbridge/secrets/demo-owner-token.
    env_file: /etc/starbridge-demo/demo.env
    environment:
      PUBLIC_URL: https://demo.starbridge.run
      TRUST_PROXY: "1"
      # Pushes go through prod's relay, as on any self-hosted server: the app shows new items
      # on a push. The relay counts them in prod's daily usage rows.
      RELAY_URL: https://starbridge.run
    # The database, the demo device's keys and the demo machine, kept across restarts and
    # redeploys so phones set up before them stay in the account (#2049).
    volumes:
      - data:/data
    mem_limit: 384m
    # Staging's Caddy reaches it here (demo.caddy).
    ports:
      - "127.0.0.1:8090:8080"
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

volumes:
  data:
