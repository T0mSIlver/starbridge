# Workflows pin actions by commit SHA (#361). Dependabot proposes version updates once a month, one
# grouped PR per ecosystem; security updates for known vulnerabilities come as soon as they're found.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Playwright 1.65's WebKit never finishes making a first device's keys (#2375): held until that's understood.
    ignore:
      - dependency-name: playwright
        versions: [">= 1.65.0"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    # android-all-instrumented holds the SDK jar Robolectric runs, and each Robolectric release names the
    # jar it runs; it moves by hand with Robolectric (#2255).
    ignore:
      - dependency-name: org.robolectric:android-all-instrumented
      # Compose BOM 2026.11 and Material 3 1.6 alphas need compileSdk 37.2; the app builds with 37.0 (#2368).
      - dependency-name: androidx.compose:compose-bom
        versions: [">= 2026.11.0"]
      - dependency-name: androidx.compose.material3:*
        versions: [">= 1.6.0-alpha01"]
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/deploy, /deploy/demo, /ios/StarbridgeProtocol, /server, /web]
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
  # The third-party images deploy/compose.yaml pulls (#1274), which the docker ecosystem, reading
  # Dockerfiles only, never sees.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    groups:
      docker-compose:
        patterns: ["*"]
