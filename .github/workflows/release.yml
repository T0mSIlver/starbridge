name: release

# A v1.2.3 or v1.2.3-rc.4 tag publishes a GitHub Release with the signed APK, the CLI binaries and
# their checksums. Run by hand, it builds the same files as a workflow artifact and releases nothing.
on:
  push:
    tags: ["v*"]
    branches: [t/gallant-mayer-1fa182] # DRY RUN ONLY, removed before review
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the v
        default: 0.0.1-rc.1

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '0.0.1-rc.1' }}
        run: |
          v=${VERSION#v}
          echo "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?' || { echo "bad version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  apk:
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          STARBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STARBRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          umask 077
          export STARBRIDGE_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$STARBRIDGE_KEYSTORE"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          ./gradlew --console=plain assembleRelease -PversionName="$VERSION"
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/starbridge-$VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: out/

  cli:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: bun run build:bin
      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: cli/dist/starbridge-*

  release:
    needs: [version, apk, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body > notes.md
          cat notes.md
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            out/
            notes.md
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" out/* --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --notes-file notes.md \
            $(case $VERSION in *-rc.*) echo --prerelease ;; esac)

  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Skipped until the owner's npm account exists and NPM_TOKEN is set.
      - if: env.NODE_AUTH_TOKEN != ''
        run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
