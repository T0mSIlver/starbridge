name: scan

# Known vulnerabilities in what we ship (#1542). Trivy scans the server and web images on ghcr.io
# once deploy.yml has pushed them for a commit, and every week the images starbridge.run runs,
# since new advisories come out after a build. osv-scanner reads the lockfiles weekly. Each keeps
# one issue open while it finds something, and closes it once a run finds nothing.
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      revision:
        description: Commit whose images to scan (default the one starbridge.run runs)
        required: false

concurrency:
  group: scan-${{ github.event_name }}
  cancel-in-progress: false

permissions: {}

env:
  TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  OSV_SCANNER: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa

jobs:
  # Fails on a high or critical vulnerability that has a fixed version; lists the rest in the
  # run's summary. A finding without a fix has nothing to act on yet.
  images:
    # Docker and gh, which some self-hosted boxes lack.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: rev
        env:
          REV: ${{ github.event.workflow_run.head_sha || inputs.revision }}
        run: |
          if [ -z "$REV" ]; then
            REV=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -D - -o /dev/null \
              https://starbridge.run/healthz | tr -d '\r' |
              awk -F': ' 'tolower($1) == "x-starbridge-revision" { print $2 }')
          fi
          case $REV in *[!0-9a-f]*) REV= ;; esac
          [ ${#REV} -eq 40 ] || { echo "::error::no commit id to scan"; exit 1; }
          # deploy.yml builds only when a file the images hold changed: no images, nothing to scan.
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:t0msilver/starbridge-server:pull" | jq -r .token)
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/t0msilver/starbridge-server/manifests/$REV"; then
            echo "::notice::No images for $REV: deploy.yml built none."
            exit 0
          fi
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
      - id: scan
        if: steps.rev.outputs.rev
        env:
          REV: ${{ steps.rev.outputs.rev }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          echo "## Images at $REV" >> "$GITHUB_STEP_SUMMARY"
          : > "$RUNNER_TEMP/blocking.md"
          for image in server web; do
            # amd64, what starbridge.run runs; arm64 holds the same packages.
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY" \
              image --quiet --platform linux/amd64 --scanners vuln --format json \
              "ghcr.io/t0msilver/starbridge-$image:$REV" > "$RUNNER_TEMP/$image.json"
            .github/scan-report.sh trivy "$image" < "$RUNNER_TEMP/$image.json" >> "$GITHUB_STEP_SUMMARY"
            .github/scan-report.sh trivy-blocking "$image" < "$RUNNER_TEMP/$image.json" >> "$RUNNER_TEMP/blocking.md"
          done
          {
            echo "blocking<<EOF"
            cat "$RUNNER_TEMP/blocking.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Open, update or close the issue
        if: ${{ !cancelled() && steps.rev.outputs.rev }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.scan.outcome }}
          FOUND: ${{ steps.scan.outputs.blocking }}
          REV: ${{ steps.rev.outputs.rev }}
        run: |
          [ "$OUTCOME" = success ] || FOUND="The scan itself failed; see the run."
          .github/scan-issue.sh image-scan "Image scan: fixable high or critical vulnerabilities" \
            "Trivy found these in the images of $REV. Rebuilding the image picks up Debian's fixes; a package's fix needs a dependency update." "$FOUND" fail

  # Weekly, and by hand. Reports every finding: a lockfile entry with a fix is a dependency
  # update to make, one without is to watch. Dependabot's alerts cover the Gradle catalog, which
  # osv-scanner cannot read without a Gradle lockfile.
  lockfiles:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        run: |
          # Exit 1 means it found something, 128 that it found no lockfile.
          code=0
          docker run --rm -v "$PWD:/src:ro" "$OSV_SCANNER" scan source -r --format json /src \
            > "$RUNNER_TEMP/osv.json" || code=$?
          [ "$code" -le 1 ] || exit "$code"
          .github/scan-report.sh osv < "$RUNNER_TEMP/osv.json" > "$RUNNER_TEMP/osv.md"
          cat "$RUNNER_TEMP/osv.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "found<<EOF"
            cat "$RUNNER_TEMP/osv.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Open, update or close the issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.scan.outcome }}
          FOUND: ${{ steps.scan.outputs.found }}
        run: |
          [ "$OUTCOME" = success ] || FOUND="The scan itself failed; see the run."
          .github/scan-issue.sh dependency-scan "Lockfile scan: known vulnerabilities" \
            "osv-scanner found these in the lockfiles at $GITHUB_SHA." "$FOUND"
