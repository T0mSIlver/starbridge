name: CodeQL

# Code scanning for every language but Swift, on every pull request and push to main and weekly.
# Swift is in codeql-swift.yml: it needs a macOS runner, the scarcest, so it runs only when the
# iOS app changes. These two replace CodeQL's default setup, which cannot run beside them (#1264).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Kotlin needs a real compile: CodeQL reads it from the compiler, and build-mode none
          # handles Java only.
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # The app's main sources, compiled for real: no build cache, no incremental compile, and the
      # Kotlin compiler in Gradle's process, where CodeQL watches it.
      - if: matrix.build-mode == 'manual'
        working-directory: android
        env:
          STARBRIDGE_KEYSTORE: ""
        run: >-
          ./gradlew --no-daemon --console=plain --no-build-cache --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false
          :app:compileDebugKotlin
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
