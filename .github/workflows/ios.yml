name: ios

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "packages/protocol/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "server/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "packages/protocol/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "server/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: the changes job reads a pull request's files from the API.
permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: ios/StarbridgeProtocol

jobs:
  # Which jobs the changed files can affect: the Swift package only reads its own sources and the
  # shared vectors, so a server or lockfile change runs the app alone. GitHub's macOS runners are
  # its scarcest. A failed comparison or a dispatched run runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protocol: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outcome != 'success' || steps.filter.outputs.protocol == 'true' }}
    defaults:
      run:
        working-directory: .
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Ignored on a pull request, which compares with its base.
          base: ${{ github.event.before }}
          filters: |
            protocol:
              - 'ios/StarbridgeProtocol/**'
              - 'packages/protocol/**'
              - '.github/workflows/ios.yml'

  # The Swift port of packages/protocol against the shared vectors (#1083), on GitHub's hosted
  # macOS runner, with the libsodium that swift-sodium bundles for Apple platforms.
  protocol-macos:
    name: StarbridgeProtocol on macOS
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - run: swift test
      # `swift test` runs on macOS; this builds the same sources for iPhone, against its slice of
      # the libsodium framework.
      - run: xcodebuild -quiet -scheme StarbridgeProtocol -destination "generic/platform=iOS" build

  # The same tests on Linux with the system libsodium, where agents develop the package. The
  # repository is mounted whole: the tests read packages/protocol/vectors.
  protocol-linux:
    name: StarbridgeProtocol on Linux
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t starbridge-swift -f ios/StarbridgeProtocol/linux.Dockerfile ios/StarbridgeProtocol
      - run: docker run --rm -v "$PWD:/repo" -w /repo/ios/StarbridgeProtocol starbridge-swift swift test

  # The app (#1105): XcodeGen writes the project, then its tests run on a simulator, JoinTests
  # against a self-hosted server started here.
  app:
    name: Starbridge app on the simulator
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - working-directory: .
        run: pnpm install --frozen-lockfile --filter @starbridge/server...
      - name: Start a self-hosted server
        working-directory: server
        run: |
          # The tests delete the account after each run that sets one up, more than the 3 an hour
          # one address may.
          DB_PATH="$RUNNER_TEMP/starbridge.db" bun run src/main.ts limits set accountDeletes 100/3600
          PORT=18731 DB_PATH="$RUNNER_TEMP/starbridge.db" OWNER_TOKEN=ci-owner-token bun run src/main.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 30); do curl -fs localhost:18731/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      # The newest Xcode the runner has, not the image's default: closer to the Mac mini's, where
      # the app is developed, and TestFlight uploads need Xcode 26 or later.
      - name: Newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          xcodebuild -version
      - name: XcodeGen 2.44.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          echo "a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Test
        env:
          TEST_RUNNER_STARBRIDGE_TEST_SERVER: http://localhost:18731
          TEST_RUNNER_STARBRIDGE_TEST_OWNER_TOKEN: ci-owner-token
        run: |
          sim=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          set -o pipefail
          xcodebuild -project Starbridge.xcodeproj -scheme Starbridge -destination "id=$sim" test 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E "error:|Test Case .*(passed|failed|skipped)|\*\* TEST"
          # JoinTests skips without a server; here it must have run.
          ! grep -q "JoinTests.*skipped" "$RUNNER_TEMP/test.log"
