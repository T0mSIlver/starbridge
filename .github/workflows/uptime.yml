name: uptime

# Checks starbridge.run every hour. On failure it opens one issue labelled `outage`, which
# GitHub emails to the repository's watchers, and closes it with a comment once checks pass.
on:
  schedule:
    # Hourly while the repository is private, where each run bills at least one Actions minute;
    # switch to "*/5 * * * *" once it is public, where runs are free.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  issues: write

env:
  BASE_URL: https://starbridge.run

jobs:
  check:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # Three checks of up to about 90 s each, then the issue step.
    timeout-minutes: 8
    steps:
      - name: Check
        id: check
        run: |
          # Retries ride out a deploy's restart; the server takes under 30 s to come back.
          check() {
            curl -fsS -o /dev/null --max-time 15 --retry 3 --retry-delay 10 --retry-all-errors "$1" 2>&1 | tail -1
            return "${PIPESTATUS[0]}"
          }
          failed=""
          out=$(check "$BASE_URL/healthz") || failed="$failed- \`$BASE_URL/healthz\`: $out"$'\n'
          out=$(check "$BASE_URL/healthz/backup") ||
            failed="$failed- \`$BASE_URL/healthz/backup\`: no good backup in the last 26 h, or the server is down ($out)"$'\n'
          out=$(check "$BASE_URL/healthz/disk") ||
            failed="$failed- \`$BASE_URL/healthz/disk\`: under 2 GB free beside the database, or the server is down ($out)"$'\n'
          {
            echo "failed<<EOF"
            printf '%s' "$failed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open, update or close the outage issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.check.outcome }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          [ "$OUTCOME" = success ] || FAILED="- The check step itself failed; see the run."$'\n'
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          issue=$(gh issue list --label outage --state open --json number --jq '.[0].number // empty')
          if [ -n "$FAILED" ]; then
            body=$(printf 'Failing checks, last seen %s:\n\n%s\nRun: %s\n' "$now" "$FAILED" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            if [ -z "$issue" ]; then
              gh label create outage --color B60205 --description "Opened and closed by the uptime workflow" 2>/dev/null || true
              gh issue create --label outage --title "Outage: ${BASE_URL#https://} failing checks since $now" --body "$body"
            else
              # Editing the body sends no email; only opening and closing do.
              gh issue edit "$issue" --body "$body"
            fi
            exit 1
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Checks pass again at $now."
          fi
