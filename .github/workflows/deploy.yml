name: deploy

# A dispatched run is named for its commit, which release.yml's wait finds it by (#2076).
run-name: ${{ inputs.sha && format('deploy {0}', inputs.sha) || github.event.workflow_run.display_title || 'deploy' }}

# Two ways in (#1538). A merge to main, once CI passes, goes to staging (staging.starbridge.run):
# the images are built, staging deploys them and runs a round trip, and the commit gets the status
# `staging`. starbridge.run takes a commit only by dispatch, `gh workflow run deploy.yml -f
# sha=<commit>`: release.yml dispatches each rc tag's commit, and the owner a hotfix. Either way it
# deploys only a commit whose `staging` status is success, which the boxes check again
# (deploy/host/deploy-rev.sh). rollback.yml goes back to a commit a box ran before; deploy/deploy.sh and
# deploy/rollback.sh stay the owner's way around both.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to deploy to starbridge.run, 40 hex characters; it must have passed on staging
        required: true
      version:
        description: The release this deploys, for the approval card; release.yml sets it, a hotfix leaves it out
        required: false

permissions: {}

jobs:
  # Staging takes every commit of main, so each one can go to prod. The images are built only when
  # a file they are built from changed since the commit staging runs (Dockerfiles, what they copy,
  # deploy/); otherwise that commit's images are tagged with this one's. Any doubt builds.
  changed:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # GitHub's runners for every job that builds or picks the images prod runs, as for the jobs that
    # hold a deploy key: no self-hosted box decides what ships (#1825, #1839).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.changed.outputs.build }}
      base: ${{ steps.changed.outputs.base }}
    steps:
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ github.event.workflow_run.head_sha }}
        run: |
          build=true
          got=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -D - -o /dev/null \
            https://staging.starbridge.run/healthz | tr -d '\r' |
            awk -F': ' 'tolower($1) == "x-starbridge-revision" { print $2 }') || got=
          case $got in *[!0-9a-f]*) got= ;; esac
          # Another run still building puts its commit on staging after this check: a commit that
          # reverts it would reuse images about to be replaced.
          busy=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?event=workflow_run&per_page=30" |
            jq --argjson id "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $id and .status != "completed")] | length') || busy=1
          if [ "$busy" != 0 ]; then
            echo "Another staging run has not finished: building."
          elif [ ${#got} -eq 40 ]; then
            # The compare lists at most 300 files; a longer list builds.
            # Only for a commit that follows staging's: an older one compares as empty, and must
            # not take a later commit's images.
            files=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$got...$REV" |
              jq -r 'if (.status == "ahead" or .status == "identical") and (.files | length) < 300 then .files[].filename else error("not after staging, or too many") end') &&
              if ! printf '%s\n' "$files" | grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.dockerignore|packages/|server/|web/|cli/|plugin/|mod/|demo/|docs/|deploy/)'; then
                build=false
                echo "Nothing the images are built from changed since $got: reusing its images."
                echo "base=$got" >> "$GITHUB_OUTPUT"
              fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # The server and web images, built once per deployed commit for both architectures and pushed
  # to ghcr.io as <image>:<commit>; the box pulls them rather than building (#1518). arm64 is for
  # the Oracle VMs, staging's and the failover target's. Each architecture builds natively on its
  # own GitHub runner and pushes <commit>-<arch>; the images job joins the two.
  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    strategy:
      matrix:
        image: [server, web]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ghcr.io/t0msilver/starbridge-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}-${{ matrix.arch }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      # Docker Hub limits anonymous pulls per address, which self-hosted boxes and GitHub's
      # runners share with others; a login counts against our account instead. Forks' and
      # Dependabot's runs get no secret and pull anonymously.
      - if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A rerun of a deploy that failed later keeps the images it already pushed.
      - id: have
        run: |
          if docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.have.outputs.have != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: steps.have.outputs.have != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          tags: ${{ env.TAG }}
          # The commit, which /healthz names. The public pages load Umami from /stats, which a
          # self-hosted build leaves out; behind a Caddy that serves no /stats, they load nothing.
          build-args: |
            REVISION=${{ github.event.workflow_run.head_sha }}
            ANALYTICS=umami
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  images:
    needs: [changed, build]
    if: ${{ !cancelled() && needs.changed.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      REV: ${{ github.event.workflow_run.head_sha }}
      BASE: ${{ needs.changed.outputs.base }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The two architectures' builds joined, or the images of the commit staging runs, when nothing
      # they are built from changed: same bytes, this commit's tag.
      - run: |
          for image in server web; do
            name=ghcr.io/t0msilver/starbridge-$image
            # A commit's tag, once pushed, never changes: a rerun keeps it.
            if docker buildx imagetools inspect "$name:$REV" >/dev/null 2>&1; then
              echo "$name:$REV exists"
            elif [ -n "$BASE" ]; then
              docker buildx imagetools create -t "$name:$REV" "$name:$BASE"
            else
              docker buildx imagetools create -t "$name:$REV" "$name:$REV-amd64" "$name:$REV-arm64"
            fi
          done
      # The box pulls without logging in. GitHub creates a package private, and only its settings
      # page makes it public, once: until then, stop here rather than at the box.
      - run: |
          for image in server web; do
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:t0msilver/starbridge-$image:pull" | jq -r .token)
            curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/t0msilver/starbridge-$image/manifests/$REV" || {
              echo "::error::ghcr.io/t0msilver/starbridge-$image is not public: make it public at https://github.com/users/T0mSIlver/packages/container/starbridge-$image/settings"
              exit 1
            }
          done

  # Staging (staging.starbridge.run, on sb-staging) runs the same images (deploy/staging/). Its
  # key's forced command deploys a commit of main and nothing else, the box fetching it itself,
  # then runs one round trip there and ends with `passed <commit>`. The commit's `staging` status
  # says whether it passed: prod deploys only one that did (#1528, #1538).
  staging:
    needs: [changed, images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    concurrency:
      group: staging
      cancel-in-progress: false
    # GitHub's runners for the jobs that hold a deploy key: no self-hosted box sees one (#1825).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      statuses: write
    environment:
      name: staging
      url: https://staging.starbridge.run
    env:
      REV: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy and run the round trip
        id: deploy
        env:
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          STAGING_TARGET: ${{ secrets.STAGING_SSH_TARGET }}
        run: |
          status() {
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$REV" \
              -d "$(jq -n --arg s "$1" --arg d "$2" --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                '{context: "staging", state: $s, description: $d, target_url: $u}')" >/dev/null
          }
          if [ -z "$STAGING_KEY" ]; then
            echo "::notice::No STAGING_SSH_KEY: staging not deployed, and prod takes nothing."
            exit 0
          fi
          status pending "Deploying to staging"
          # A failed deploy or round trip fails the job through the tee.
          set -o pipefail
          umask 077
          printf '%s\n' "$STAGING_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          if ! ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 "$STAGING_TARGET" "$REV" |
            tee "$RUNNER_TEMP/staging.log"; then
            status failure "Staging's deploy or round trip failed"
            exit 1
          fi
          # A commit older than the one staging runs is skipped there, so it never passed.
          if [ "$(tail -n 1 "$RUNNER_TEMP/staging.log")" != "passed $REV" ]; then
            status error "Not deployed: staging runs a later commit"
            exit 0
          fi
          # The server names the deployed commit (deploy/compose.yaml).
          got=$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -D - -o /dev/null \
            https://staging.starbridge.run/healthz | tr -d '\r' |
            awk -F': ' 'tolower($1) == "x-starbridge-revision" { print $2 }') || got=
          if [ "$got" != "$REV" ]; then
            status failure "Staging names ${got:-no revision}"
            echo "staging runs ${got:-no named revision}, not $REV"
            exit 1
          fi
          # The digests staging pulled and runs (deploy/host/apply.sh), which prod runs (#1715).
          for image in server web; do
            digest=$(sed -n "s/^image $image \(sha256:[0-9a-f]\{64\}\)$/\1/p" "$RUNNER_TEMP/staging.log")
            [ "$(printf '%s\n' "$digest" | grep -c .)" -eq 1 ] || {
              status failure "Staging named no $image digest"
              echo "staging named no single $image digest"
              exit 1
            }
            echo "$image=$digest" >> "$GITHUB_OUTPUT"
          done
          echo "passed=true" >> "$GITHUB_OUTPUT"
      # The images staging ran, by digest, which starbridge.run's box reads with the step below and
      # deploys (deploy/host/deploy-rev.sh, #1715): a tag can be pushed again, a digest cannot.
      - name: Staging ran server@${{ steps.deploy.outputs.server }}
        if: steps.deploy.outputs.passed == 'true'
        env:
          DIGEST: ${{ steps.deploy.outputs.server }}
        run: echo "staging ran server@$DIGEST"
      - name: Staging ran web@${{ steps.deploy.outputs.web }}
        if: steps.deploy.outputs.passed == 'true'
        env:
          DIGEST: ${{ steps.deploy.outputs.web }}
        run: echo "staging ran web@$DIGEST"
      # starbridge.run's box reads this step from GitHub's API before it deploys the commit
      # (deploy/host/deploy-rev.sh). Its name holds the commit, and only main's deploy.yml runs it,
      # so a status that some other run posted cannot stand in for it. It runs before the status
      # turns success, so whoever reads the status finds it done.
      - name: Staging passed ${{ github.event.workflow_run.head_sha }}
        if: steps.deploy.outputs.passed == 'true'
        run: echo "staging passed $REV"
      - name: Set the staging status
        if: steps.deploy.outputs.passed == 'true'
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$REV" \
            -d "$(jq -n --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{context: "staging", state: "success", description: "Deployed to staging; round trip passed", target_url: $u}')" >/dev/null

  # starbridge.run's environment waits for the owner's approval (#2009), and the release waits for
  # the deploy up to 12 hours (#2076). This job sends the owner a Starbridge card with the run's
  # link as the deploy starts waiting, and closes it once the deploy job starts or ends: the same job
  # does both, as `settle` needs the state that `ask` leaves in the runner's config folder. It reads the
  # CI_CARD_MACHINE secret of the `ci-card` environment, a Starbridge machine of its own (docs/ci.md,
  # "Approval cards"); without it the job only prints the link. It holds no key to anything else,
  # and a failed card never stops the deploy.
  card:
    if: github.event_name == 'workflow_dispatch'
    # A failed card must not fail the run, which release.yml reads to end its wait.
    continue-on-error: true
    runs-on: ubuntu-latest
    # GitHub's runners end every job at 6 hours, so the card closes by then at the latest.
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    environment: ci-card
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: ask
        env:
          STARBRIDGE_MACHINE: ${{ secrets.CI_CARD_MACHINE }}
          GH_TOKEN: ${{ github.token }}
          REV: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          # release.yml's limit on the runner it picked.
          WAIT_MINUTES: ${{ vars.TRUSTED_RUNNER && 715 || 350 }}
        run: |
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          echo "starbridge.run waits for your approval: $run_url"
          if [ -z "$STARBRIDGE_MACHINE" ]; then
            echo "::notice::No CI_CARD_MACHINE secret in the ci-card environment: no card sent."
            exit 0
          fi
          # The inputs go into text, not a shell: only a full commit id and a release number pass.
          case $REV in *[!0-9a-f]* | "") exit 0 ;; esac
          [ ${#REV} -eq 40 ] || exit 0
          printf '%s' "$VERSION" | grep -Eqx '([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)?' || VERSION=
          short=$(printf '%.7s' "$REV")
          subject=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$REV" | jq -r '.commit.message | split("\n")[0]') || subject=
          name=${VERSION:+v$VERSION}
          context="Ships ${name:+$name, }commit $short${subject:+: $subject}."
          if [ -n "$VERSION" ]; then
            context="$context The release gives up waiting at about $(date -u -d "+$WAIT_MINUTES minutes" '+%H:%M UTC') and publishes nothing."
          fi
          context="$context Approve it on the run page, linked here; this card does not approve it, and closes when the run ends."
          # `next` is the newest rc: the latest final may predate STARBRIDGE_MACHINE.
          npm install -g starbridge@next >/dev/null 2>&1 || { echo "::warning::starbridge did not install: no card sent."; exit 0; }
          id=$(starbridge ask --waiting --project starbridge --link "$run_url" \
            --question "Approve the prod deploy of ${name:-$short}?" \
            --context "$context" --option Approved --option "Not now") || { echo "::warning::The card was not sent."; exit 0; }
          echo "ID=$id" >> "$GITHUB_ENV"
      # The deploy job waits for the review, then runs: its status says which. A rejected or
      # cancelled one ends too, and the card closes either way.
      - name: Close the card when the deploy starts or ends
        if: env.ID != ''
        timeout-minutes: 355
        env:
          GH_TOKEN: ${{ github.token }}
          STARBRIDGE_MACHINE: ${{ secrets.CI_CARD_MACHINE }}
        run: |
          for _ in $(seq 1 650); do
            job=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" |
              jq -r '[.jobs[] | select(.name == "deploy")][0] | "\(.status) \(.conclusion)"') || job=
            case $job in
              "in_progress "*) starbridge settle "$ID" --outcome elsewhere || true; exit 0 ;;
              "completed success") starbridge settle "$ID" --outcome elsewhere || true; exit 0 ;;
              "completed "*) starbridge settle "$ID" --outcome withdrawn --reason "The deploy ended: ${job#completed }" || true; exit 0 ;;
            esac
            sleep 30
          done
          starbridge settle "$ID" --outcome withdrawn --reason "Six hours passed; the deploy may still wait on its run page" || true
      # Cancelling the run while it waits ends this job too.
      - name: Close the card when the run is cancelled
        if: cancelled() && env.ID != ''
        env:
          STARBRIDGE_MACHINE: ${{ secrets.CI_CARD_MACHINE }}
        run: starbridge settle "$ID" --outcome withdrawn --reason "The run was cancelled" || true

  # starbridge.run, by dispatch only: release.yml for each rc tag, the owner for a hotfix. It waits
  # for the commit's `staging` status, up to an hour, as an rc tag can follow its merge by minutes,
  # and deploys only on success.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Reads the commit's statuses and main's history.
    permissions:
      contents: read
      statuses: read
    environment:
      name: starbridge.run
      url: https://starbridge.run
    env:
      REV: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Staging passed this commit
        timeout-minutes: 65
        run: |
          # It goes into an API path and the box's forced command: a full commit id only.
          case $REV in *[!0-9a-f]* | "") echo "not a commit id: $REV"; exit 1 ;; esac
          [ ${#REV} -eq 40 ] || { echo "not a full commit id: $REV"; exit 1; }
          for _ in $(seq 120); do
            state=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$REV/statuses?per_page=100" |
              jq -r '[.[] | select(.context == "staging")][0].state // "none"') || state=none
            case $state in
              success) echo "staging passed $REV"; exit 0 ;;
              failure | error) echo "staging did not pass $REV ($state): not deployed"; exit 1 ;;
            esac
            echo "staging: ${state}; waiting"
            sleep 30
          done
          echo "staging never passed $REV within an hour"
          exit 1
      # The key's forced command on the box runs starbridge-deploy with this commit id and nothing
      # else (deploy/setup-actions-deploy.sh); it refuses a commit older than the one deployed, and
      # checks the staging pass again from GitHub's API.
      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes deploy@starbridge.run "$REV"
      # The server names the commit it runs: this one, or a later one when the box refused this
      # older one. Anything else is a deploy that never went live.
      - name: Check the live revision
        run: |
          got=$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -D - -o /dev/null \
            https://starbridge.run/healthz | tr -d '\r' |
            awk -F': ' 'tolower($1) == "x-starbridge-revision" { print $2 }')
          [ -n "$got" ] || { echo "starbridge.run names no revision"; exit 1; }
          case $got in *[!0-9a-f]*) got= ;; esac
          [ ${#got} -eq 40 ] || { echo "starbridge.run names no commit id"; exit 1; }
          status=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$REV...$got?per_page=1" | jq -r .status)
          case $status in
            identical | ahead) echo "starbridge.run runs $got" ;;
            *) echo "starbridge.run runs $got, not $REV or later ($status)"; exit 1 ;;
          esac
      # A healthy server can still fail to push or answer. sb-oracle, the outside check's VM, runs
      # one round trip on its test account now (#1522): a card, its Web Push, an answer read back.
      # The key's forced command does only that (starbridge-planning, infra/oracle/check-now.sh).
      - name: Round trip from outside
        # sb-check-now gives up after 180 s; a dropped connection must not hold the deploy queue.
        timeout-minutes: 5
        env:
          SMOKE_KEY: ${{ secrets.SMOKE_SSH_KEY }}
          SMOKE_KNOWN_HOSTS: ${{ secrets.SMOKE_KNOWN_HOSTS }}
          SMOKE_TARGET: ${{ secrets.SMOKE_SSH_TARGET }}
        run: |
          if [ -z "$SMOKE_KEY" ]; then
            echo "::notice::No SMOKE_SSH_KEY: no round trip."
            exit 0
          fi
          umask 077
          printf '%s\n' "$SMOKE_KEY" > "$RUNNER_TEMP/smoke-key"
          printf '%s\n' "$SMOKE_KNOWN_HOSTS" > "$RUNNER_TEMP/smoke-known-hosts"
          ssh -i "$RUNNER_TEMP/smoke-key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/smoke-known-hosts" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 "$SMOKE_TARGET"
