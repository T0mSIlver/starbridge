name: deploy

# Deploys main to starbridge.run once CI passes on it. deploy/deploy.sh stays for manual rollbacks.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  # Nothing to deploy when no file the box builds from changed since the revision it runs: what
  # the Dockerfiles copy (server/Dockerfile, web/Dockerfile, deploy/demo/Dockerfile) and deploy/,
  # which it applies. The run passes either way, so whoever waits for a merge to be live waits for
  # this run, not for the live revision. Any doubt deploys.
  changed:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ${{ vars.TRUSTED_RUNNER && fromJSON(vars.TRUSTED_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ github.event.workflow_run.head_sha }}
        run: |
          deploy=true
          got=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -D - -o /dev/null \
            https://starbridge.run/healthz | tr -d '\r' |
            awk -F': ' 'tolower($1) == "x-starbridge-revision" { print $2 }') || got=
          case $got in *[!0-9a-f]*) got= ;; esac
          # Another run still building or deploying puts its commit live after this check: a
          # commit that reverts it would be skipped against a revision that is about to change.
          busy=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?per_page=30" |
            jq --argjson id "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $id and .status != "completed")] | length') || busy=1
          if [ "$busy" != 0 ]; then
            echo "Another deploy run has not finished: deploying."
          elif [ ${#got} -eq 40 ]; then
            # Not gh: some self-hosted runners lack it (dell2-2). The compare lists at most 300
            # files; a longer list deploys.
            files=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$got...$REV" |
              jq -r 'if (.files | length) < 300 then .files[].filename else error("too many") end') &&
              if ! printf '%s\n' "$files" | grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.dockerignore|packages/|server/|web/|cli/|plugin/|mod/|demo/|docs/|deploy/)'; then
                deploy=false
                echo "Nothing the box builds from changed since $got: not deploying."
              fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # The server and web images, built once per deployed commit for both architectures and pushed
  # to ghcr.io as <image>:<commit>; the box pulls them rather than building (#1518). arm64 is for
  # the Oracle VMs, staging's and the failover target's. Each architecture builds natively on its
  # own runner, GitHub's for arm64, and pushes <commit>-<arch>; the images job joins the two.
  build:
    needs: changed
    if: needs.changed.outputs.deploy == 'true'
    strategy:
      matrix:
        image: [server, web]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || (vars.TRUSTED_RUNNER && fromJSON(vars.TRUSTED_RUNNER) || 'ubuntu-latest') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ghcr.io/t0msilver/starbridge-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}-${{ matrix.arch }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A rerun of a deploy that failed later keeps the images it already pushed.
      - id: have
        run: |
          if docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.have.outputs.have != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: steps.have.outputs.have != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          tags: ${{ env.TAG }}
          # The commit, which /healthz names. The public pages load Umami from /stats, which a
          # self-hosted build leaves out; behind a Caddy that serves no /stats, they load nothing.
          build-args: |
            REVISION=${{ github.event.workflow_run.head_sha }}
            ANALYTICS=umami
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  images:
    needs: [changed, build]
    runs-on: ${{ vars.TRUSTED_RUNNER && fromJSON(vars.TRUSTED_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      REV: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: |
          for image in server web; do
            name=ghcr.io/t0msilver/starbridge-$image
            docker buildx imagetools create -t "$name:$REV" "$name:$REV-amd64" "$name:$REV-arm64"
          done
      # The box pulls without logging in. GitHub creates a package private, and only its settings
      # page makes it public, once: until then, stop here rather than at the box.
      - run: |
          for image in server web; do
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:t0msilver/starbridge-$image:pull" | jq -r .token)
            curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/t0msilver/starbridge-$image/manifests/$REV" || {
              echo "::error::ghcr.io/t0msilver/starbridge-$image is not public: make it public at https://github.com/users/T0mSIlver/packages/container/starbridge-$image/settings"
              exit 1
            }
          done

  # Staging (staging.starbridge.run, on homelab-arm) runs the same images (deploy/staging/). Its
  # key's forced command deploys a commit of main and nothing else, the box fetching it itself,
  # then runs one round trip there. Until the VM and the key exist, the job passes with a notice.
  staging:
    needs: [changed, images]
    concurrency:
      group: staging
      cancel-in-progress: false
    runs-on: ${{ vars.TRUSTED_RUNNER && fromJSON(vars.TRUSTED_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Compares staging's revision with this run's.
    permissions:
      contents: read
    environment:
      name: staging
      url: https://staging.starbridge.run
    env:
      REV: ${{ github.event.workflow_run.head_sha }}
    steps:
      - id: deploy
        name: Deploy
        env:
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          STAGING_TARGET: ${{ secrets.STAGING_SSH_TARGET }}
        run: |
          if [ -z "$STAGING_KEY" ]; then
            echo "::notice::No STAGING_SSH_KEY: staging not deployed."
            exit 0
          fi
          umask 077
          printf '%s\n' "$STAGING_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$STAGING_TARGET" "$REV"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Check the live revision
        if: steps.deploy.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          got=$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -D - -o /dev/null \
            https://staging.starbridge.run/healthz | tr -d '\r' |
            awk -F': ' 'tolower($1) == "x-starbridge-revision" { print $2 }')
          # Its commit, or a later one of main's when the box skipped this older one.
          case $got in *[!0-9a-f]*) got= ;; esac
          [ ${#got} -eq 40 ] || { echo "staging names no commit id"; exit 1; }
          status=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$REV...$got?per_page=1" | jq -r .status)
          case $status in
            identical | ahead) echo "staging runs $got" ;;
            *) echo "staging runs $got, not $REV or later ($status)"; exit 1 ;;
          esac

  # Prod deploys only a commit staging took and passed its round trip on (#1528).
  deploy:
    needs: [changed, images, staging]
    # On the job, not the workflow: a run for a failed or cancelled CI run skips this job without
    # joining the queue, so it cannot replace a deploy that is waiting.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ${{ vars.TRUSTED_RUNNER && fromJSON(vars.TRUSTED_RUNNER) || 'ubuntu-latest' }}
    # Reads main's history to compare the live revision with this run's.
    permissions:
      contents: read
    environment:
      name: starbridge.run
      url: https://starbridge.run
    steps:
      # The key's forced command on the box runs starbridge-deploy with this commit id and nothing
      # else (deploy/setup-actions-deploy.sh).
      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REV: ${{ github.event.workflow_run.head_sha }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes deploy@starbridge.run "$REV"
      # The server names the commit it was built from: this run's, or a later one of main's when
      # the box refused this older one. Anything else is a deploy that never went live. REV is the
      # commit CI passed on, which can be older than main's head, the commit the run list shows.
      - name: Check the live revision
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ github.event.workflow_run.head_sha }}
        run: |
          got=$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -D - -o /dev/null \
            https://starbridge.run/healthz | tr -d '\r' |
            awk -F': ' 'tolower($1) == "x-starbridge-revision" { print $2 }')
          [ -n "$got" ] || { echo "starbridge.run names no revision"; exit 1; }
          # It goes into an API path: only a commit id, as starbridge-deploy takes.
          case $got in *[!0-9a-f]*) got= ;; esac
          [ ${#got} -eq 40 ] || { echo "starbridge.run names no commit id"; exit 1; }
          # Not gh: some self-hosted runners lack it (dell2-2).
          status=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$REV...$got?per_page=1" | jq -r .status)
          case $status in
            identical | ahead) echo "starbridge.run runs $got" ;;
            *) echo "starbridge.run runs $got, not $REV or later ($status)"; exit 1 ;;
          esac
      # The deploy also rebuilt the Play reviewers' demo server from this commit (#1016).
      - name: Check the demo server
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://demo.starbridge.run/v1/demo |
            jq -e '.demo == true' >/dev/null || { echo "demo.starbridge.run is not a demo server"; exit 1; }
