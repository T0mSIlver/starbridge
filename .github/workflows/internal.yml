name: internal

# The owner runs main (#1540): main's Android build goes to Play's internal testing track, which
# only the owner joins; Alpha keeps the rcs. It builds on every push to main that touches what the
# app is built from, and on each rc tag, so the phone never holds older code than an rc (#1690).
# An rc tag builds as a main build: the tagged commit, with main's versionCode scheme. Its
# versionCode takes the next of slots 50 to 98 of the version under way, between its rcs and its
# final (VersionCode.kt), or of the next patch once the version's final is tagged (#1731); once they are spent a build is skipped and the job summary says so. A
# commit the track already holds, or one older than its last build, takes no slot. Run by hand,
# it builds main (the plan job stops other refs) under the same rules, to replace a failed build.
# The iPhone app follows to TestFlight's internal testers once the repository variable
# IOS_MAIN_TESTFLIGHT is true, which waits on Apple's export compliance code: nightly at 03:00 UTC
# and by hand, apart from the Android builds. The desktop app stays on rcs.
on:
  push:
    branches: [main]
    # The paths of ci.yml's Android filter and android.yml.
    paths:
      - "android/**"
      - "packages/protocol/vectors/**"
      - ".github/workflows/internal.yml"
    tags: ["v*-rc.*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# One upload at a time. A run waits for the one running, which is never cancelled (a Play edit
# cut off mid-way leaves the track as it was, but the build is wasted); when several wait, GitHub
# keeps the newest and cancels the older ones, so the newest commit wins. The nightly iPhone run
# has its own group, so it never replaces a waiting Android build.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'internal-ios' || 'internal' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What the internal track holds: the commit of its last build, and its highest code.
  plan:
    # Only main and rc tags reach the Play environment; a run by hand on a branch stops here.
    if: github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: play-release
    # Play keeps one open edit per account: a second one, here or in release.yml, voids the first.
    concurrency:
      group: play-edit
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      after: ${{ steps.plan.outputs.after }}
      last: ${{ steps.plan.outputs.last }}
      final: ${{ steps.plan.outputs.final }}
    steps:
      - id: setup
        env:
          SET: ${{ vars.PLAY_WIF_PROVIDER != '' && vars.PLAY_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$SET" = true ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::PLAY_WIF_PROVIDER or PLAY_SERVICE_ACCOUNT is not set; nothing built."; fi
      - if: steps.setup.outputs.set
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - if: steps.setup.outputs.set
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - if: steps.setup.outputs.set
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - if: steps.setup.outputs.set
        id: plan
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          version=$(jq -r .version cli/package.json)
          state=$(bun cli/scripts/play.ts internal-state "$version")
          echo "internal track: $state"
          after=$(printf '%s' "$state" | jq -r .maxCode)
          final=$(printf '%s' "$state" | jq -r .final)
          code=$(printf '%s' "$state" | jq -r '.code // ""')
          last=$(printf '%s' "$state" | jq -r '.name | capture("^main-(?<c>[0-9a-f]{8,40})$").c // ""')
          build=true
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null &&
            git merge-base --is-ancestor "$GITHUB_SHA" "$last"; then
            build=false
            msg="The internal track already holds main-$last, which contains ${GITHUB_SHA::8}: nothing to upload."
            echo "$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$code" ]; then
            build=false
            msg="No build of main left for $version: its versionCode slots 50 to 98 are spent (the track is at $after). ${GITHUB_SHA::8} was not uploaded; cut the next rc or the final, then the next merge builds."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "final=$final" >> "$GITHUB_OUTPUT"

  # Signed with the upload key, as release.yml's Android job.
  android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # GitHub's runner, as release.yml's: no self-hosted box sees the release key (#1825).
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Build the signed App Bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          STARBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STARBRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AFTER: ${{ needs.plan.outputs.after }}
          FINAL: ${{ needs.plan.outputs.final }}
        run: |
          umask 077
          export STARBRIDGE_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$STARBRIDGE_KEYSTORE"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          ./gradlew --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process bundleRelease \
            -PmainAfter="$AFTER" -PmainFinal="$FINAL" -PmainCommit="${GITHUB_SHA::8}"
          mkdir -p ../out
          cp app/build/outputs/bundle/release/app-release.aab ../out/starbridge-main.aab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-internal
          path: out/
          retention-days: 3

  play:
    needs: [plan, android]
    runs-on: ubuntu-latest
    environment: play-release
    # Play keeps one open edit per account: a second one, here or in release.yml, voids the first.
    concurrency:
      group: play-edit
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-internal
          path: out
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      # Named after the commit, which the next build compares with; the notes list the Android
      # changes since the last build.
      - name: Upload to the internal track
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          LAST: ${{ needs.plan.outputs.last }}
        run: |
          range=HEAD~5..HEAD
          if [ -n "$LAST" ] && git cat-file -e "$LAST^{commit}" 2>/dev/null; then range="$LAST..HEAD"; fi
          { echo "### Android"; git log "$range" --no-merges -n 20 --format='- %s' -- android packages/protocol/vectors; } > notes.md
          bun cli/scripts/play.ts out/starbridge-main.aab "main-${GITHUB_SHA::12}" notes.md --track internal \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$GITHUB_SHA"

  # An rc tag shares the queue with main's pushes, so it can replace a waiting main build, and its
  # commit can be older than main's. Either way the track would be behind main when the run ends:
  # start a run on main when this one is done (#1690).
  catch-up:
    needs: [plan, play]
    if: ${{ !cancelled() && github.ref_type == 'tag' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          if git diff --quiet HEAD origin/main -- android packages/protocol/vectors; then
            echo "main's app is the tag's: nothing to catch up."
            exit 0
          fi
          echo "main's app differs from ${GITHUB_REF_NAME}'s: building main next." | tee -a "$GITHUB_STEP_SUMMARY"
          gh workflow run internal.yml --repo "$GITHUB_REPOSITORY" --ref main

  # release.yml's TestFlight job, from main, numbered by its run; TestFlight's internal testers get
  # every build. Nightly, when the iPhone app changed in the last day, and by hand.
  ios:
    if: vars.IOS_MAIN_TESTFLIGHT == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - env:
          GH_TOKEN: ${{ github.token }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$BY_HAND" != true ] && [ -z "$(git log --since='25 hours ago' --format=%H -- ios packages/protocol/vectors)" ]; then
            echo "The iPhone app is unchanged since yesterday: no build tonight."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version="$(jq -r .version cli/package.json)" -f testflight_only=true
