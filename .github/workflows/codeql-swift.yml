name: CodeQL Swift

# Code scanning for the Swift of ios/StarbridgeProtocol and the desktop widgets, on GitHub's macOS
# runner: only when they change, and weekly on main for queries that changed meanwhile. The iOS app
# itself is not scanned: it needs XcodeGen and a simulator build (#1650). The other languages are in
# codeql.yml.
on:
  push:
    branches: [main]
    paths:
      - "ios/StarbridgeProtocol/**"
      - "desktop/widgets/**"
      - ".github/workflows/codeql-swift.yml"
  pull_request:
    paths:
      - "ios/StarbridgeProtocol/**"
      - "desktop/widgets/**"
      - ".github/workflows/codeql-swift.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      # CodeQL reads what these builds compile. Its autobuilder took 10 to 14 minutes and built only
      # the widgets (#1650).
      - run: swift build
        working-directory: desktop/widgets
      - run: swift build
        working-directory: ios/StarbridgeProtocol
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
