name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "packages/protocol/vectors/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "packages/protocol/vectors/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  # One labelled runner takes every Android build: two Gradle builds at once ran the box out of memory.
  build:
    name: build, unit tests, screenshots
    runs-on: ${{ vars.ANDROID_RUNNER || vars.RUNNER || 'ubuntu-24.04' }}
    # Builds of pull requests never sign with the release key, even on a runner whose environment sets it.
    env:
      STARBRIDGE_KEYSTORE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Self-hosted runners on one machine share one GRADLE_USER_HOME, which Gradle locks for
      # concurrent builds; a cache restore would overwrite files another job is reading.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ vars.RUNNER != '' }}

      # verifyRoborazziDebug runs every unit test and fails when a screen drifts
      # from app/screenshots/.
      - name: Build and test
        # No daemon and an in-process Kotlin compiler: nothing stays in memory after the build on a shared self-hosted runner.
        run: ./gradlew --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process assembleRelease verifyRoborazziDebug

      - name: Screenshot diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diffs
          if-no-files-found: ignore
          path: |
            android/app/screenshots/*_compare.png
            android/app/build/outputs/roborazzi/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starbridge-apk
          path: android/app/build/outputs/apk/release/*.apk
