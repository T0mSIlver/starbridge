name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "packages/protocol/vectors/**"
      - "demo/smoke/**"
      - "scripts/licenses/**"
      - ".github/workflows/android.yml"
      - ".github/android-system-image.sh"
  pull_request:
    paths:
      - "android/**"
      - "packages/protocol/vectors/**"
      - "demo/smoke/**"
      - "scripts/licenses/**"
      - ".github/workflows/android.yml"
      - ".github/android-system-image.sh"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

env:
  # google-services.json for a build without the real one (the build job's "Placeholder Firebase
  # values" step says why).
  PLACEHOLDER_FIREBASE: '{"project_info": {"project_number": "123456789012", "project_id": "starbridge-ci"}, "client": [{"client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef", "android_client_info": {"package_name": "dev.starbridge.app"}}, "api_key": [{"current_key": "AIzaSy000000000000000000000000000000000"}]}]}'

jobs:
  # A push to main builds on the labelled runner ANDROID_RUNNER when it is set; pull requests' and
  # dispatched runs' code builds on GitHub's runners only. One labelled runner takes every Android
  # build: two Gradle builds at once ran the box out of memory, so on a push the two jobs below
  # take turns on it.
  #
  # The release APK and the checks are two jobs side by side, which share only the Gradle cache:
  # the emulator jobs start once the APK is built, while the unit tests still run (#1916).
  build:
    name: build
    runs-on: ${{ github.event_name == 'push' && vars.ANDROID_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 40
    # Builds of pull requests never sign with the release key, even on a runner whose environment sets it.
    env:
      STARBRIDGE_KEYSTORE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Self-hosted runners on one machine share one GRADLE_USER_HOME, which Gradle locks for
      # concurrent builds; a cache restore would overwrite files another job is reading.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}

      # Without google-services.json the app builds with FCM off, and the emulator job's smoke needs
      # it on: a build with no real file gets made-up Firebase values. Google refuses them, so the app
      # gets no FCM token; the emulator job sets NO_FIREBASE and the smoke subscribes a made-up token
      # for the app's device (demo/smoke/android.ts), and fakes FCM itself. No release uses this APK:
      # release.yml builds its own with the real file, and its smoke needs the app to register.
      - name: Placeholder Firebase values
        run: |
          [ -f app/google-services.json ] || [ -f ~/.config/starbridge/secrets/google-services.json ] ||
            printf '%s' "$PLACEHOLDER_FIREBASE" > app/google-services.json

      # The release build: R8's shrinking and lintVitalRelease, then the APK the emulator jobs install.
      - name: Build the release APK
        # No daemon and an in-process Kotlin compiler: nothing stays in memory after the build on
        # a shared self-hosted runner.
        run: ./gradlew --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      # The runtime classpath's licences against scripts/licenses/allow.json: a copyleft, vendor-terms
      # or unnamed licence not listed there fails (#2024). The notices the APK ships are generated from
      # the same list, so a library added or dropped changes that file in the same pull request.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Licences
        run: |
          ./gradlew --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process :app:runtimeModules
          bun ../scripts/licenses/licenses.ts check android app/build/licenses/runtime-modules.txt
          bun ../scripts/licenses/licenses.ts notices android app/build/licenses/runtime-modules.txt > "$RUNNER_TEMP/notices.txt"
          diff -u app/src/main/assets/third-party-notices.txt "$RUNNER_TEMP/notices.txt" ||
            { echo "::error::Update android/app/src/main/assets/third-party-notices.txt: ./gradlew :app:runtimeModules, then bun scripts/licenses/licenses.ts notices android app/build/licenses/runtime-modules.txt"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starbridge-apk
          path: android/app/build/outputs/apk/release/*.apk

  test:
    name: unit tests, lint, screenshots
    runs-on: ${{ github.event_name == 'push' && vars.ANDROID_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 40
    env:
      STARBRIDGE_KEYSTORE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}

      # The same placeholder as the build job's: the debug build reads it too.
      - name: Placeholder Firebase values
        run: |
          [ -f app/google-services.json ] || [ -f ~/.config/starbridge/secrets/google-services.json ] ||
            printf '%s' "$PLACEHOLDER_FIREBASE" > app/google-services.json

      # verifyRoborazziDebug runs every unit test and fails when a screen drifts
      # from app/screenshots/; lintDebug fails on any lint error (#899).
      - name: Lint and test
        run: ./gradlew --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process lintDebug verifyRoborazziDebug

      - name: Screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          if-no-files-found: ignore
          path: |
            android/app/screenshots/*_compare.png
            android/app/build/outputs/roborazzi/

  # A dispatched run reports through the commit status `android`, since a dispatched run's checks
  # never show on a pull request: dependabot-gradle.yml dispatches one after it pushes Gradle's
  # checksums to a Dependabot branch, and set the status pending.
  status:
    name: status
    needs: [build, test]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=android \
            -f state="$([ "$RESULT" = true ] && echo success || echo failure)" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

  # Pull requests build on GitHub's runners, which start with an empty Gradle home unless main
  # saved one in GitHub's cache, and main's build above runs on ANDROID_RUNNER with the cache off.
  # This job runs the same build on GitHub's runner for each push to main and saves the Gradle home,
  # dependencies and build cache, that pull requests restore (#1662).
  cache:
    name: Gradle cache for pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      STARBRIDGE_KEYSTORE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process assembleRelease lintDebug verifyRoborazziDebug

  # The app on an emulator, as evidence for a pull request (docs/ci.md, "Evidence"): the release
  # smoke (demo/smoke/android.ts) on a phone and a tablet, keeping each stop in light and dark and
  # the app drawer with our icon beside the stock apps'. Main's runs are what pull requests compare
  # with. GitHub's runner, since an emulator needs KVM; google_apis, since the smoke's FCM delivery
  # needs root; API 36 as release.yml's smoke, since on 35 the tablet's first run registered no FCM
  # token. Never a fork's pull request: the evidence job writes to the repository.
  emulator:
    name: emulator (${{ matrix.profile }})
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: phone
            device: pixel_7
          - profile: tablet
            device: pixel_tablet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starbridge-apk
          path: apk
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Installs the system image, again when the download is corrupt (#2181).
      - name: Install the system image
        run: .github/android-system-image.sh
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 15
        env:
          EVIDENCE: ${{ runner.temp }}/evidence
          PROFILE: ${{ matrix.profile }}
          # This APK has made-up Firebase values, so the app cannot get an FCM token.
          NO_FIREBASE: "1"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ADB="$ANDROID_HOME/platform-tools/adb" bun demo/smoke/android.ts "$(ls apk/*.apk | head -n 1)" smoke-out
      - if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-evidence-${{ matrix.profile }}-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          overwrite: true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-evidence-${{ matrix.profile }}-failed
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
      # The smoke's own screenshot, UI dump and logcat where it stopped.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-failure-${{ matrix.profile }}
          path: smoke-out/
          retention-days: 7
          if-no-files-found: ignore

  # The pull request's Android evidence comment, as CI's evidence job writes the web's
  # (web/e2e/evidence.ts with CLIENT=android).
  evidence:
    name: evidence
    needs: emulator
    if: ${{ !cancelled() && needs.emulator.result != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      # The merge with main and its first parents: the base whose evidence it compares with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --filter @starbridge/web
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-evidence-*
          path: ${{ runner.temp }}/pr
      - run: bun web/e2e/evidence.ts "$RUNNER_TEMP/pr" "$RUNNER_TEMP/base" "$RUNNER_TEMP/out"
        env:
          CLIENT: android
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
