name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "packages/protocol/vectors/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "packages/protocol/vectors/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  # One labelled runner takes every Android build: two Gradle builds at once ran the box out of memory.
  build:
    name: build, unit tests, screenshots
    runs-on: ${{ vars.ANDROID_RUNNER || vars.RUNNER || 'ubuntu-24.04' }}
    # Builds of pull requests never sign with the release key, even on a runner whose environment sets it.
    env:
      STARBRIDGE_KEYSTORE: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The self-hosted runners share one GRADLE_USER_HOME, which Gradle locks for concurrent
      # builds; a cache restore would overwrite files another job is reading.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ vars.RUNNER != '' }}

      # verifyRoborazziDebug runs every unit test and fails when a screen drifts
      # from app/screenshots/.
      - name: Build and test
        # No daemon and an in-process Kotlin compiler: nothing stays in memory after the build on the shared dev box.
        run: ./gradlew --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process assembleRelease verifyRoborazziDebug

      - name: Screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          if-no-files-found: ignore
          path: |
            android/app/screenshots/*_compare.png
            android/app/build/outputs/roborazzi/

      - uses: actions/upload-artifact@v7
        with:
          name: starbridge-apk
          path: android/app/build/outputs/apk/release/*.apk
