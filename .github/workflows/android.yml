name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "packages/protocol/vectors/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "packages/protocol/vectors/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  # A push to main builds on the labelled runner ANDROID_RUNNER when it is set; pull requests' and
  # dispatched runs' code builds on GitHub's runners only. One labelled runner takes every Android
  # build: two Gradle builds at once ran the box out of memory.
  build:
    name: build, unit tests, screenshots
    runs-on: ${{ github.event_name == 'push' && vars.ANDROID_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 40
    # Builds of pull requests never sign with the release key, even on a runner whose environment sets it.
    env:
      STARBRIDGE_KEYSTORE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Self-hosted runners on one machine share one GRADLE_USER_HOME, which Gradle locks for
      # concurrent builds; a cache restore would overwrite files another job is reading.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}

      # verifyRoborazziDebug runs every unit test and fails when a screen drifts
      # from app/screenshots/; lintDebug fails on any lint error (#899).
      - name: Build, lint and test
        # No daemon and an in-process Kotlin compiler: nothing stays in memory after the build on
        # a shared self-hosted runner.
        run: ./gradlew --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process assembleRelease lintDebug verifyRoborazziDebug

      - name: Screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          if-no-files-found: ignore
          path: |
            android/app/screenshots/*_compare.png
            android/app/build/outputs/roborazzi/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starbridge-apk
          path: android/app/build/outputs/apk/release/*.apk

  # A dispatched run reports through the commit status `android`, since a dispatched run's checks
  # never show on a pull request: dependabot-gradle.yml dispatches one after it pushes Gradle's
  # checksums to a Dependabot branch, and set the status pending.
  status:
    name: status
    needs: build
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build.result }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=android \
            -f state="$([ "$RESULT" = success ] && echo success || echo failure)" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

  # Pull requests build on GitHub's runners, which start with an empty Gradle home unless main
  # saved one in GitHub's cache, and main's build above runs on ANDROID_RUNNER with the cache off.
  # This job runs the same build on GitHub's runner for each push to main and saves the Gradle home,
  # dependencies and build cache, that pull requests restore (#1662).
  cache:
    name: Gradle cache for pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      STARBRIDGE_KEYSTORE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process assembleRelease lintDebug verifyRoborazziDebug
