name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# A pull request's new push cancels its run. Runs on main never cancel each other: the tip job
# queues on its own.
concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub's hosted macOS runner, never a self-hosted one: on a public repository, any pull
  # request could run code on it. It builds the app, runs the smoke test and keeps the DMGs.
  mac:
    name: build, smoke test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter @starbridge/desktop
      - working-directory: desktop
        run: |
          pnpm exec install-electron
          pnpm test
          pnpm e2e
      - working-directory: desktop
        # Ad hoc signing holds no secret, so pull requests may do it too; unsigned, macOS refuses
        # to open the app. The hardened runtime is for notarization, and an ad hoc signature
        # cannot meet its library validation.
        run: pnpm exec electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
        env:
          CSC_FOR_PULL_REQUEST: "true"
      # The Needs you widget, built by the afterPack hook with the runner's Xcode (#1031).
      - working-directory: desktop
        run: scripts/check-widgets.sh release/mac-arm64/Starbridge.app
      # The budgets in test/perf.ts, measured on the packaged app.
      - working-directory: desktop
        run: node test/perf.ts release/mac-arm64/Starbridge.app/Contents/MacOS/Starbridge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Starbridge-mac
          path: desktop/release/*.dmg
          retention-days: 14

  # desktop/test/stack.ts on macOS, the app's own platform; ci.yml runs it on Linux for web changes.
  stack:
    name: whole product on macOS
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - working-directory: desktop
        run: |
          pnpm exec install-electron
          pnpm run build
      - run: node desktop/test/stack.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-stack-failure
          path: ${{ runner.temp }}/starbridge-desktop-failure.png
          if-no-files-found: ignore

  # The tip build (#1692): every push to main that touches the app builds it signed with the
  # Developer ID and notarized, as `<version under way>-tip.<n>` (scripts/tip.ts), for the
  # publish job below. It also catches a signing or notarization break before the rc tag (#1684).
  # One build at a time: a running one is never cancelled, and of the runs waiting the newest wins.
  # It needs no other job, so runs reach that queue in the order they were pushed, and it runs the
  # tests itself. The Developer ID lives in the desktop-release environment, which only main and
  # tags can use; the job checks the ref too, so a run by hand from a branch never reaches it. Run
  # by hand on main, it builds main under the same rules, to replace a failed build.
  tip:
    name: tip build
    if: >-
      ${{ vars.DESKTOP_SIGNING == 'true' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' }}
    runs-on: macos-15
    # Apple's notarization of each architecture can take up to an hour.
    timeout-minutes: 150
    environment: desktop-release
    concurrency:
      group: desktop-tip
      cancel-in-progress: false
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      last: ${{ steps.plan.outputs.last }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: plan
        run: bun desktop/scripts/tip.ts plan
      - if: steps.plan.outputs.build == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.plan.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.plan.outputs.build == 'true'
        run: pnpm install --frozen-lockfile --filter @starbridge/desktop
      - if: steps.plan.outputs.build == 'true'
        working-directory: desktop
        run: |
          pnpm exec install-electron
          pnpm test
          pnpm e2e
      - if: steps.plan.outputs.build == 'true'
        name: Build, sign and notarize
        working-directory: desktop
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm pkg set version="$VERSION"
          pnpm run build
          scripts/sign.sh
      - if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Starbridge-mac-tip
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
          retention-days: 14

  # Publishes the tip build as the one release `tip` of T0mSIlver/starbridge-tip, which Macs on
  # the Tip channel update from (spec/releases.md); never a release here, which Obtainium users
  # with prereleases on would get. Its own job on Linux, so the token that writes that repository
  # never shares a job with third-party code (the build's packages). The token is a fine-grained
  # one that can write starbridge-tip's contents only; GITHUB_TOKEN reaches no other repository.
  # Publishes run one at a time, and one whose commit the tip already contains is dropped, so the
  # tip never goes back.
  tip-publish:
    name: tip publish
    needs: tip
    if: needs.tip.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-release
    concurrency:
      group: desktop-tip-publish
      cancel-in-progress: false
    env:
      TIP_REPO: T0mSIlver/starbridge-tip
      VERSION: ${{ needs.tip.outputs.version }}
    steps:
      - id: token
        env:
          SET: ${{ secrets.TIP_RELEASE_TOKEN != '' }}
        run: |
          if [ "$SET" = true ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::TIP_RELEASE_TOKEN is not set: $VERSION was built and signed, not published."; fi
      - if: steps.token.outputs.set
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - if: steps.token.outputs.set
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - if: steps.token.outputs.set
        id: check
        run: bun desktop/scripts/tip.ts check
      - if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Starbridge-mac-tip
          path: out
      # The new files go up before latest-mac.yml names them, and the previous build's stay, so an
      # app that read the last latest-mac.yml can still download its zip.
      - if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.TIP_RELEASE_TOKEN }}
          LAST: ${{ needs.tip.outputs.last }}
        run: |
          previous=$(curl -fsL "https://github.com/$TIP_REPO/releases/download/tip/tip.json" | jq -r '.version // ""' || true)
          printf '{"version":"%s","commit":"%s"}\n' "$VERSION" "$GITHUB_SHA" > out/tip.json
          range=HEAD~5..HEAD
          if [ -n "$LAST" ] && git cat-file -e "$LAST^{commit}" 2>/dev/null; then range="$LAST..HEAD"; fi
          {
            echo "Starbridge for Mac $VERSION, built from [${GITHUB_SHA::8}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) on main. Untested beyond CI."
            echo
            echo "### Desktop changes since the last tip"
            git log "$range" --no-merges -n 20 --format='- %s' -- desktop
          } > notes.md
          if ! gh release view tip -R "$TIP_REPO" > /dev/null 2>&1; then
            gh release create tip -R "$TIP_REPO" --title "Starbridge for Mac, tip" --notes-file notes.md --latest
          fi
          gh release upload tip -R "$TIP_REPO" --clobber out/*.zip out/*.dmg out/*.blockmap
          gh release upload tip -R "$TIP_REPO" --clobber out/latest-mac.yml out/tip.json
          gh release edit tip -R "$TIP_REPO" --notes-file notes.md
          gh release view tip -R "$TIP_REPO" --json assets -q '.assets[].name' | while read -r name; do
            case "$name" in
              latest-mac.yml | tip.json | "Starbridge-$VERSION-"*) ;;
              "Starbridge-$previous-"*) ;;
              *) gh release delete-asset tip "$name" -R "$TIP_REPO" -y ;;
            esac
          done
          echo "Published $VERSION to https://github.com/$TIP_REPO/releases/tag/tip" | tee -a "$GITHUB_STEP_SUMMARY"
