name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub's hosted macOS runner, never a self-hosted one: on a public repository, any pull
  # request could run code on it. It builds the app, runs the smoke test and keeps the DMGs.
  mac:
    name: build, smoke test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter @starbridge/desktop
      - working-directory: desktop
        run: |
          pnpm exec install-electron
          pnpm test
          pnpm e2e
      - working-directory: desktop
        # Ad hoc signing holds no secret, so pull requests may do it too; unsigned, macOS refuses
        # to open the app. The hardened runtime is for notarization, and an ad hoc signature
        # cannot meet its library validation.
        run: pnpm exec electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
        env:
          CSC_FOR_PULL_REQUEST: "true"
      # The budgets in test/perf.ts, measured on the packaged app.
      - working-directory: desktop
        run: node test/perf.ts release/mac-arm64/Starbridge.app/Contents/MacOS/Starbridge
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Starbridge-mac
          path: desktop/release/*.dmg
          retention-days: 14
