name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub's hosted macOS runner, never a self-hosted one: on a public repository, any pull
  # request could run code on it. It builds the app, runs the smoke test and keeps the DMGs.
  mac:
    name: build, smoke test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter @starbridge/desktop
      - working-directory: desktop
        run: |
          pnpm exec install-electron
          pnpm test
          pnpm e2e
      - working-directory: desktop
        # Ad hoc signing holds no secret, so pull requests may do it too; unsigned, macOS refuses
        # to open the app. The hardened runtime is for notarization, and an ad hoc signature
        # cannot meet its library validation.
        run: pnpm exec electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
        env:
          CSC_FOR_PULL_REQUEST: "true"
      # The Needs you widget, built by the afterPack hook with the runner's Xcode (#1031).
      - working-directory: desktop
        run: scripts/check-widgets.sh release/mac-arm64/Starbridge.app
      # The budgets in test/perf.ts, measured on the packaged app.
      - working-directory: desktop
        run: node test/perf.ts release/mac-arm64/Starbridge.app/Contents/MacOS/Starbridge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Starbridge-mac
          path: desktop/release/*.dmg
          retention-days: 14

  # desktop/test/stack.ts on macOS, the app's own platform; ci.yml runs it on Linux for web changes.
  stack:
    name: whole product on macOS
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - working-directory: desktop
        run: |
          pnpm exec install-electron
          pnpm run build
      - run: node desktop/test/stack.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-stack-failure
          path: ${{ runner.temp }}/starbridge-desktop-failure.png
          if-no-files-found: ignore

  # Whether a push to main changed what signing and notarization read, which only release.yml
  # otherwise exercises, at the rc tag.
  signing:
    name: signing inputs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.signing == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
      - id: filter
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.before }}
          filters: |
            signing:
              - 'desktop/electron-builder.yml'
              - 'desktop/package.json'
              - 'desktop/scripts/sign.sh'
              - 'desktop/scripts/after-pack.cjs'
              - 'desktop/scripts/after-sign.cjs'
              - 'desktop/scripts/widgets.cjs'
              - 'desktop/widgets/Info.plist'
              - 'desktop/widgets/build.sh'
              - 'pnpm-lock.yaml'
              - '.github/workflows/desktop.yml'

  # A signed and notarized build, to catch a signing or notarization break before the rc tag: on a
  # push to main that changed the signing inputs above, or by hand from main. Installed apps update
  # from releases only (spec/releases.md), so no other push needs one (#1684). The Developer ID
  # lives in the desktop-release environment, which only main and tags can use; the job checks the
  # ref too, so a run by hand from a branch never reaches it.
  signed:
    name: signed build
    if: >-
      ${{ !cancelled() && needs.mac.result == 'success' && vars.DESKTOP_SIGNING == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      (github.event_name == 'workflow_dispatch' || needs.signing.outputs.changed == 'true') }}
    needs: [mac, signing]
    runs-on: macos-15
    timeout-minutes: 30
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter @starbridge/desktop
      - working-directory: desktop
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          pnpm exec install-electron
          pnpm run build
          scripts/sign.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Starbridge-mac-signed
          path: desktop/release/*.dmg
          retention-days: 14
