name: CI

on:
  push:
    branches: [main]
  pull_request:
  # dependabot-lockfile.yml starts a run on a Dependabot branch after pushing its lockfile. Such
  # a run checks everything, as a push to main does, on the branch itself rather than its merge
  # with main.
  workflow_dispatch:

# A new push to a pull request cancels its older run. Main runs one at a time and never cancels
# the running one; a newer merge replaces the one waiting, so only main's head waits. deploy.yml
# deploys each run that passes, and the box refuses a revision older than the one it runs. Other
# runs, pull requests' and dispatched ones, cancel older runs for the same ref.
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# pull-requests: the changed-files step reads a pull request's files from the API.
permissions:
  contents: read
  pull-requests: read

# Jobs run on GitHub-hosted runners, with two exceptions for the test and e2e jobs. On a push to
# main, the repository variable RUNNER points the test job at the self-hosted main pool. A pull
# request from this repository's own branches, Dependabot's aside, runs both on the self-hosted PR
# pool, PR_RUNNER (#1204): it holds no secrets, and no pull request reaches RUNNER's pool or
# ANDROID_RUNNER's. A fork's pull request and a dispatched run stay on GitHub's runners.
#
# A run tests only what its files can affect: a pull request's files against its base, a push's
# since the commit before it (the changes job). A job that cannot be affected is skipped, which
# counts as passing; a skipped workflow would not. deploy.yml deploys once all of CI passes.
jobs:
  # Which jobs a run's files can affect. A push compares github.event.before with the pushed
  # commit, so a merge that touches only the Android or desktop app or docs skips the rest. A
  # push whose before is missing (a new branch) or not in the history, a dispatched run, and a
  # failure of this job run everything. GitHub's runner, whatever vars.RUNNER says: every job
  # waits for this one, and self-hosted runners can all be busy.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.checks == 'true' || steps.filter.outputs.android_read == 'true' }}
      e2e: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.e2e == 'true' || steps.filter.outputs.pages == 'true' || steps.filter.outputs.e2e_read == 'true' }}
      desktop: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.desktop == 'true' }}
      cli: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.cli == 'true' || steps.filter.outputs.android_read == 'true' }}
      images: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.images == 'true' }}
    steps:
      # The pushed commit and its parent, which is github.event.before for a squash merge. A push
      # of more commits finds no before here and runs everything. Trees only, enough to diff names.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
      - id: all
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          all=false
          case "${{ github.event_name }}" in
            pull_request) ;;
            push) git cat-file -e "$BEFORE^{commit}" 2>/dev/null || all=true ;;
            *) all=true ;;
          esac
          echo "all=$all" >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.all.outputs.all != 'true'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Ignored on a pull request, which compares with its base.
          base: ${{ github.event.before }}
          predicate-quantifier: some-with-excludes
          filters: |
            checks:
              - '**'
              - '!android/**'
              - '!.github/workflows/android.yml'
            # Android files other suites read: web's tests check Tokens.kt against DESIGN.md
            # (web/scripts/tokens.ts), the CLI's the app's version (cli/test/version.test.ts).
            android_read:
              - 'android/app/src/main/kotlin/dev/starbridge/app/ui/theme/Tokens.kt'
              - 'android/app/build.gradle.kts'
            # The Android test image web/e2e/run.ts attaches to a question.
            e2e_read:
              - 'android/app/src/test/resources/fake/phone-inbox.png'
            # Not the apps, the evals, and Markdown no page renders.
            e2e:
              - '**'
              - '!android/**'
              - '!desktop/**'
              - '!.github/workflows/android.yml'
              - '!.github/workflows/desktop.yml'
              - '!evals/**'
              - '!**/*.md'
            # /docs renders docs/*.md, cli/README.md and server/README.md (web/src/lib/docs.ts).
            pages:
              - 'docs/*.md'
              - 'cli/README.md'
              - 'server/README.md'
            desktop:
              - '**'
              - '!android/**'
              - '!.github/workflows/android.yml'
              - '!evals/**'
              - '!docs/**'
              - '!**/*.md'
            # The CLI's suite reads the plugin and mod and runs the server, never web or the apps.
            cli:
              - '**'
              - '!android/**'
              - '!desktop/**'
              - '!web/**'
              - '!evals/**'
              - '!docs/**'
              - '!deploy/**'
              - '!demo/**'
              - '!*.md'
              - '!.github/workflows/android.yml'
              - '!.github/workflows/desktop.yml'
            images:
              - '**/Dockerfile'
              - '**/*.Dockerfile'
              - '.dockerignore'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'deploy/compose.yaml'
              - 'deploy/demo/**'
              - '.github/workflows/ci.yml'
      # A failed comparison runs everything too.
      - id: open
        run: echo "all=${{ steps.all.outputs.all == 'true' || steps.filter.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"

  # One job, so the workspace installs once instead of three times.
  checks:
    name: test, typecheck, lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.checks == 'true') }}
    runs-on: ${{ github.event_name == 'push' && vars.RUNNER || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && vars.PR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per job: runners on one machine would share ~/setup-pnpm and clobber each other.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        # A store that stays on the runner between jobs. Its default, under the job's temp
        # folder, is emptied after each job, so every install downloaded every package.
        env:
          pnpm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The whole product on one machine (web/e2e/run.ts), in three parts side by side, each with its
  # own server and browser (E2E_SHARD). Each screenshot also fails on layout breakage: a page wider
  # than the window, clipped, spilled or overlapping text (web/e2e/layout.ts). GitHub's runners
  # for main's pushes: the parts wait on timers more than they compute, and three at once would
  # fill the main pool. A pull request's run them on the PR pool, as the test job.
  e2e:
    name: end to end (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [inbox, snooze, devices]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && vars.PR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    # actions: the tested step lists artifacts.
    permissions:
      contents: read
      actions: read
    steps:
      # A merge to main skips a part when a run of this workflow already passed it on the same tree
      # (#878): most often the pull request's own last run, on its merge with the main commit it
      # was then merged onto, since a squash merge of an unchanged base yields the same tree. A
      # tree holds every file, ci.yml included, so the run that passed tested exactly what main
      # now holds, with the same steps. Each passing part uploads an artifact named after its tree.
      # Only this repository's branches count: a fork's pull request runs its own ci.yml and could
      # upload any name. Anything else, an expired artifact or a failed API call, runs it again.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: e2e-passed-${{ matrix.shard }}-${{ github.event.head_commit.tree_id }}
        # Not gh: some self-hosted runners lack it (dell2-2).
        run: |
          n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" |
            jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length') || n=0
          echo "passed=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: scope
        run: echo "run=${{ steps.tested.outputs.passed != 'true' }}" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # No package-manager-cache: it uploaded the pnpm store to GitHub's cache after every run,
      # ~50 s of the job, while the store already stays on the runner.
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        env:
          pnpm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
      # The PR pool has Firefox's system libraries already; only GitHub's runners install them.
      # Firefox goes in each runner's own tool cache: the PR pool's runners on one host share a home, and
      # three parts installing into one directory at once could break each other's copy.
      - if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @starbridge/web exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} firefox
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
      # A part takes up to ~4 min, the snooze's 2-minute wait for its time included. At 7 the
      # watchdog prints what is still running and stops it.
      - if: steps.scope.outputs.run == 'true'
        run: .github/watchdog.sh 420 xvfb-run -a node web/e2e/run.ts
        timeout-minutes: 8
        env:
          TMPDIR: ${{ runner.temp }}
          E2E_SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
      # What a later merge of the same tree looks up (the tested step above). It holds the commit
      # that passed; overwrite, since a re-run attempt uploads it again.
      - id: tree
        if: steps.scope.outputs.run == 'true'
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/e2e-passed"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-passed-${{ matrix.shard }}-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/e2e-passed
          retention-days: 7
          overwrite: true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ matrix.shard }}
          path: ${{ runner.temp }}/starbridge-e2e-failure.png
          if-no-files-found: ignore

  # The desktop app on the whole product (desktop/test/stack.ts): signs in and pairs in the app's
  # window, and answers `starbridge ask --wait` from its notifications. GitHub's runner, whatever
  # vars.RUNNER says: Electron needs the desktop libraries the hosted image has.
  desktop-e2e:
    name: desktop end to end
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - working-directory: desktop
        run: |
          pnpm exec install-electron
          pnpm run build
      - run: .github/watchdog.sh 600 xvfb-run -a node desktop/test/stack.ts
        timeout-minutes: 11
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-failure
          path: ${{ runner.temp }}/starbridge-desktop-failure.png
          if-no-files-found: ignore

  # Builds the deployed images, without pushing them, when a pull request can change their base
  # images or dependencies: a change that breaks a build fails here, not at the deploy (#430).
  # Source changes outside these paths that a Dockerfile copies (docs/ for web, cli/ for the demo)
  # are not covered. On a push, main's deploy builds them on the server.
  images:
    name: images
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One step each, so one broken image does not hide another. --pull as the deploy does, so a
      # stale local copy of a base image cannot pass here and fail there; Caddy's is not pulled
      # there either.
      - if: ${{ !cancelled() }}
        run: docker build --pull -f server/Dockerfile -t starbridge-server .
      - if: ${{ !cancelled() }}
        run: docker build --pull -f web/Dockerfile -t starbridge-web .
      - if: ${{ !cancelled() }}
        run: docker build --pull -f deploy/demo/Dockerfile -t starbridge-demo .
      - if: ${{ !cancelled() }}
        run: docker build -f deploy/caddy.Dockerfile -t starbridge-caddy deploy

  # The CLI on Windows (#552): a built binary and the whole suite must pass (#884). Bun on Windows
  # can wedge in a test past its own timeout, so each file runs alone and a hung one is killed and
  # named (#834). GitHub's Windows runners need a public repository or paid minutes, so a private
  # repository skips the job.
  windows:
    name: CLI on Windows
    needs: changes
    if: ${{ !cancelled() && !github.event.repository.private && (needs.changes.result != 'success' || needs.changes.outputs.cli == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - name: Build and start the binary
        run: |
          bun build src/main.ts --compile --target=bun-windows-x64 --outfile dist/starbridge.exe
          ./dist/starbridge.exe --version
          ./dist/starbridge.exe --help
      - name: The whole CLI suite
        timeout-minutes: 12
        run: bun scripts/test-each.ts

  # The CLI on macOS (#877): the launchd service and the screen readers run only there. Unlike
  # Windows, the whole suite must pass. Each test file runs alone and is killed when it hangs, so
  # a hang names its file well before the job limit.
  macos:
    name: CLI on macOS
    needs: changes
    if: ${{ !cancelled() && !github.event.repository.private && (needs.changes.result != 'success' || needs.changes.outputs.cli == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - name: Build and start the binary
        run: |
          bun build src/main.ts --compile --target=bun-darwin-arm64 --outfile dist/starbridge
          ./dist/starbridge --version
          ./dist/starbridge --help
      - name: The whole CLI suite
        timeout-minutes: 12
        run: bun scripts/test-each.ts

  # A pull request lists only the checks of runs its own events started, so a dispatched run's
  # checks never show on it; a commit status does. dependabot-lockfile.yml set it to pending. A
  # dispatched run runs every job, so a skipped one fails the status, except Windows and macOS,
  # which a private repository skips.
  status:
    name: status
    needs: [changes, checks, e2e, desktop-e2e, images, windows, macos]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          state=$(jq -r --argjson private "$PRIVATE" '
            [to_entries[] | select(.value.result != "success")
              | select((.value.result == "skipped" and $private and (.key == "windows" or .key == "macos")) | not)]
            | if length == 0 then "success" else "failure" end' <<<"$NEEDS")
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=CI -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
