name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run. Main runs one at a time and never cancels
# the running one; a newer merge replaces the one waiting, so only main's head waits. deploy.yml
# deploys each run that passes, and the box refuses a revision older than the one it runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# pull-requests: the changed-files step reads a pull request's files from the API.
permissions:
  contents: read
  pull-requests: read

# Jobs run on the maintainer's self-hosted runners while the repository variable RUNNER is set
# (deploy/setup-runners.sh); delete the variable to go back to GitHub's runners.
#
# A pull request runs only the jobs its files can affect. A job that cannot be affected still
# starts and passes in seconds, so its check reports success, which a skipped workflow would
# not. Main runs everything: deploy.yml deploys once all of CI passes.
jobs:
  # One job, so the workspace installs once instead of three times.
  checks:
    name: test, typecheck, lint
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            run:
              - '**'
              - '!android/**'
              - '!.github/workflows/android.yml'
      - id: scope
        run: echo "run=${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # Per job: runners on one machine would share ~/setup-pnpm and clobber each other.
          dest: ${{ runner.temp }}/setup-pnpm
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        # A store that stays on the runner between jobs. Its default, under the job's temp
        # folder, is emptied after each job, so every install downloaded every package.
        env:
          pnpm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
      - if: steps.scope.outputs.run == 'true'
        run: pnpm lint
      - if: steps.scope.outputs.run == 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.run == 'true'
        run: pnpm test

  # The whole product on one machine (web/e2e/run.ts). Each screenshot also fails on layout
  # breakage: a page wider than the window, clipped, spilled or overlapping text (web/e2e/layout.ts).
  e2e:
    name: end to end
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # Not affected: the Android app, the evals, and Markdown no page renders. /docs renders
      # docs/*.md, cli/README.md and server/README.md (web/src/lib/docs.ts).
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!android/**'
              - '!.github/workflows/android.yml'
              - '!evals/**'
              - '!**/*.md'
            pages:
              - 'docs/*.md'
              - 'cli/README.md'
              - 'server/README.md'
      - id: scope
        run: echo "run=${{ github.event_name != 'pull_request' || steps.changes.outputs.code == 'true' || steps.changes.outputs.pages == 'true' }}" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # No package-manager-cache: it uploaded the pnpm store to GitHub's cache after every run,
      # ~50 s of the job, while the store already stays on the runner.
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        env:
          pnpm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
      - if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @starbridge/web exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} firefox
        timeout-minutes: 5
      # Next's build cache (compiled modules, TypeScript's build info) stays on the runner, which
      # takes ~25 s off the build. The checkout deletes web/.next, not the folder it links to.
      - if: steps.scope.outputs.run == 'true' && runner.environment == 'self-hosted'
        run: |
          cache=$RUNNER_TOOL_CACHE/next-cache
          if [ -d "$cache" ] && [ "$(du -sm "$cache" | cut -f1)" -gt 2048 ]; then rm -rf "$cache"; fi
          mkdir -p "$cache" web/.next
          ln -sfn "$cache" web/.next/cache
      # A run takes ~5 min. At 10 the watchdog prints what is still running and stops it.
      - if: steps.scope.outputs.run == 'true'
        run: .github/watchdog.sh 600 xvfb-run -a node web/e2e/run.ts
        timeout-minutes: 11
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure
          path: ${{ runner.temp }}/starbridge-e2e-failure.png
          if-no-files-found: ignore
