name: CI

on:
  push:
    branches: [main]
  pull_request:
  # dependabot-lockfile.yml starts a run on a Dependabot branch after pushing its lockfile. Such
  # a run checks everything, as a push to main does, on the branch itself rather than its merge
  # with main.
  workflow_dispatch:

# A new push to a pull request cancels its older run. Main runs one at a time and never cancels
# the running one; a newer merge replaces the one waiting, so only main's head waits. deploy.yml
# deploys each run that passes to staging, which refuses a commit older than the one it runs. Other
# runs, pull requests' and dispatched ones, cancel older runs for the same ref.
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

# Jobs run on GitHub-hosted runners unless a repository variable names a self-hosted pool, as a
# JSON array of labels (docs/ci.md). A push to main runs the test job on TRUSTED_RUNNER. A pull
# request from this repository's own branches, Dependabot's aside, runs the test job on
# PR_LIGHT_RUNNER and the image builds on PR_DOCKER_RUNNER: the PR pool holds no secrets, and no
# pull request job reaches TRUSTED_RUNNER's pool or ANDROID_RUNNER's. A fork's pull request and a
# dispatched run stay on GitHub's runners.
#
# A run tests only what its files can affect: a pull request's files against its base, a push's
# since the commit before it (the changes job). A job that cannot be affected is skipped, which
# counts as passing; a skipped workflow would not. deploy.yml deploys to staging once all of CI
# passes.
jobs:
  # Which jobs a run's files can affect. A push compares github.event.before with the pushed
  # commit, so a merge that touches only the Android or desktop app or docs skips the rest. A
  # push whose before is missing (a new branch) or not in the history, a dispatched run, and a
  # failure of this job run everything. GitHub's runner, whatever the runner variables say:
  # every job waits for this one, and self-hosted runners can all be busy.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull-requests: paths-filter reads a pull request's files from the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checks: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.checks == 'true' || steps.filter.outputs.android_read == 'true' }}
      e2e: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.e2e == 'true' || steps.filter.outputs.pages == 'true' || steps.filter.outputs.e2e_read == 'true' }}
      desktop: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.desktop == 'true' }}
      cli: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.cli == 'true' || steps.filter.outputs.android_read == 'true' }}
      images: ${{ steps.open.outputs.all == 'true' || steps.filter.outputs.images == 'true' }}
    steps:
      # The pushed commit and its parent, which is github.event.before for a squash merge. A push
      # of more commits finds no before here and runs everything. Trees only, enough to diff names.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
      - id: all
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          all=false
          case "${{ github.event_name }}" in
            pull_request) ;;
            push) git cat-file -e "$BEFORE^{commit}" 2>/dev/null || all=true ;;
            *) all=true ;;
          esac
          echo "all=$all" >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.all.outputs.all != 'true'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Ignored on a pull request, which compares with its base.
          base: ${{ github.event.before }}
          predicate-quantifier: some-with-excludes
          filters: |
            checks:
              - '**'
              - '!android/**'
              - '!.github/workflows/android.yml'
            # Android files other suites read: web's tests check Tokens.kt against DESIGN.md
            # (web/scripts/tokens.ts), the CLI's the app's version (cli/test/version.test.ts).
            android_read:
              - 'android/app/src/main/kotlin/dev/starbridge/app/ui/theme/Tokens.kt'
              - 'android/app/build.gradle.kts'
            # The Android test image web/e2e/run.ts attaches to a question.
            e2e_read:
              - 'android/app/src/test/resources/fake/phone-inbox.png'
            # Not the apps, the evals, and Markdown no page renders.
            e2e:
              - '**'
              - '!android/**'
              - '!desktop/**'
              - '!.github/workflows/android.yml'
              - '!.github/workflows/desktop.yml'
              - '!evals/**'
              - '!**/*.md'
            # /docs renders docs/*.md, cli/README.md and server/README.md (web/src/lib/docs.ts).
            pages:
              - 'docs/*.md'
              - 'cli/README.md'
              - 'server/README.md'
            desktop:
              - '**'
              - '!android/**'
              - '!.github/workflows/android.yml'
              - '!evals/**'
              - '!docs/**'
              - '!**/*.md'
            # The CLI's suite reads the plugin and mod and runs the server, never web, the apps or
            # spec/. Its macOS job waits for GitHub's scarcest runner, so it skips what it cannot read.
            cli:
              - '**'
              - '!android/**'
              - '!desktop/**'
              - '!ios/**'
              - '!web/**'
              - '!evals/**'
              - '!docs/**'
              - '!spec/**'
              - '!deploy/**'
              - '!demo/**'
              - '!*.md'
              - '!.github/workflows/android.yml'
              - '!.github/workflows/desktop.yml'
              - '!.github/workflows/ios.yml'
              - '!.github/workflows/codeql*.yml'
            images:
              - '**/Dockerfile'
              - '**/*.Dockerfile'
              - '.dockerignore'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'deploy/compose.yaml'
              - 'deploy/Caddyfile'
              - 'deploy/host/caddy-auth.sh'
              - 'deploy/demo/**'
              - '.github/workflows/ci.yml'
      # A failed comparison runs everything too.
      - id: open
        run: echo "all=${{ steps.all.outputs.all == 'true' || steps.filter.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"

  # One job, so the workspace installs once instead of three times.
  checks:
    name: test, typecheck, lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.checks == 'true') }}
    runs-on: ${{ github.event_name == 'push' && vars.TRUSTED_RUNNER && fromJSON(vars.TRUSTED_RUNNER) || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && vars.PR_LIGHT_RUNNER && fromJSON(vars.PR_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per job: runners on one machine would share ~/setup-pnpm and clobber each other.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The same Node on every runner, not whichever a self-hosted box has.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        # A store that stays on the runner between jobs. Its default, under the job's temp
        # folder, is emptied after each job, so every install downloaded every package.
        env:
          pnpm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A copyleft, attribution, vendor-terms or unnamed licence among the runtime dependencies fails
      # unless scripts/licenses/allow.json lists it with a reason (#2024). Android's runs in android.yml.
      # pnpm reads package metadata from the store the install used.
      - run: bun scripts/licenses/licenses.ts check npm
        env:
          pnpm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store

  # The whole product on one machine (web/e2e/run.ts), in three parts side by side, each with its
  # own server and browser (E2E_SHARD). Each screenshot also fails on layout breakage: a page wider
  # than the window, clipped, spilled or overlapping text (web/e2e/layout.ts). GitHub's runners,
  # whatever the runner variables say: the parts wait on timers more than they compute, and three
  # per run queued for minutes behind the PR pool's two heavy slots (#1638).
  e2e:
    name: end to end (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [inbox, snooze, devices]
    runs-on: ubuntu-latest
    # Room for a slow mirror's 10-minute install below and the part's 8 minutes.
    timeout-minutes: 20
    # actions: the tested step reads artifacts and runs; pull-requests: it finds the merged one.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # A merge to main skips a part when a run of this workflow already passed it on the same tree
      # (#878): most often the pull request's own last run, on its merge with the main commit it
      # was then merged onto, since a squash merge of an unchanged base yields the same tree. A
      # tree holds every file, ci.yml included, so the run that passed tested exactly what main
      # now holds, with the same steps. Each passing part uploads an artifact named after its tree,
      # holding the commit it tested.
      # Code in a pull request's jobs can upload an artifact under any name, so the name alone
      # proves nothing (#1732). An artifact counts only when its run is this workflow's, on this
      # commit or on the head of the pull request merged as it, that run's job for this part
      # passed, and the commit in it has this tree and is that head or GitHub's merge of it. A
      # fork's runs never count. Anything else, an expired artifact or a failed API call, runs it.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
          NAME: e2e-passed-${{ matrix.shard }}-${{ github.event.head_commit.tree_id }}
          JOB: end to end (${{ matrix.shard }})
        run: |
          passed=false
          heads="$GITHUB_SHA $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.merged_at) | .head.sha')" ||
            heads=$GITHUB_SHA
          rows=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
            --jq '.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id) | "\(.id) \(.workflow_run.id) \(.workflow_run.head_sha)"') ||
            rows=
          while read -r artifact run head; do
            [ -n "$artifact" ] || continue
            case " $heads " in *" $head "*) ;; *) echo "artifact $artifact: run $run tested $head, neither this commit nor its pull request's head"; continue ;; esac
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .path)" = .github/workflows/ci.yml ] ||
              { echo "artifact $artifact: run $run is not CI"; continue; }
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == env.JOB) | .conclusion')" = success ] ||
              { echo "artifact $artifact: $JOB did not pass in run $run"; continue; }
            tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" | funzip 2>/dev/null | tr -d '\n') || tested=
            case $tested in *[!0-9a-f]* | "") echo "artifact $artifact: no commit in it"; continue ;; esac
            line=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$tested" --jq '"\(.tree.sha) \(.sha) \([.parents[].sha] | join(" "))"') ||
              continue
            set -- $line
            [ "$1" = "$TREE" ] || { echo "artifact $artifact: $tested has another tree"; continue; }
            case " $2 $3 ${4:-} " in *" $head "*) passed=true; echo "run=$run" >> "$GITHUB_OUTPUT"; break ;; esac
            echo "artifact $artifact: $tested is neither $head nor a merge of it"
          done <<ROWS
          $rows
          ROWS
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
      - id: scope
        run: echo "run=${{ steps.tested.outputs.passed != 'true' }}" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # No package-manager-cache: it uploaded the pnpm store to GitHub's cache after every run,
      # ~50 s of the job, for an install that takes ~6 s without it.
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      # Playwright's browsers, from GitHub's cache: the download once took over 5 minutes (#1916).
      # Pull requests restore what main saved and save nothing, so they never evict main's
      # Gradle cache; the key names the Playwright version and the browsers this part installs.
      - id: browsers
        if: steps.scope.outputs.run == 'true'
        run: |
          echo "key=playwright-${{ runner.os }}-$(jq -r .devDependencies.playwright web/package.json)-${{ matrix.shard == 'devices' && 'firefox-webkit' || 'firefox' }}" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.key }}
      # --with-deps installs the system packages from Ubuntu's mirror, which at times sends
      # them at ~40 KB/s: 5 minutes timed out on main twice on 22 Oct (#1806). It takes ~20 s.
      - if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @starbridge/web exec playwright install --with-deps firefox
        timeout-minutes: 10
      # A part takes up to ~4 min, the snooze's 2-minute wait for its time included. At 7 the
      # watchdog prints what is still running and stops it.
      - if: steps.scope.outputs.run == 'true'
        run: .github/watchdog.sh 420 xvfb-run -a node web/e2e/run.ts
        timeout-minutes: 8
        env:
          TMPDIR: ${{ runner.temp }}
          E2E_SHARD: ${{ matrix.shard }}
          EVIDENCE: ${{ runner.temp }}/evidence
      # The narrow-window rules (web/e2e/narrow.ts, #1608) in WebKit, once, beside the devices part.
      - if: steps.scope.outputs.run == 'true' && matrix.shard == 'devices'
        run: pnpm --filter @starbridge/web exec playwright install --with-deps webkit
        timeout-minutes: 5
      - if: steps.scope.outputs.run == 'true' && matrix.shard == 'devices'
        run: .github/watchdog.sh 300 node web/e2e/narrow.ts
        timeout-minutes: 6
        env:
          TMPDIR: ${{ runner.temp }}
      - if: steps.scope.outputs.run == 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.key }}
      # What a later merge of the same tree looks up (the tested step above). It holds the commit
      # that passed; overwrite, since a re-run attempt uploads it again.
      - id: tree
        if: steps.scope.outputs.run == 'true'
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/e2e-passed"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-passed-${{ matrix.shard }}-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/e2e-passed
          retention-days: 7
          overwrite: true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/starbridge-e2e-failure.png
            ${{ runner.temp }}/starbridge-narrow-failure.png
          if-no-files-found: ignore
      # The part's evidence (docs/ci.md, "Evidence"): screenshots, traces and the steps driven,
      # named after the tree tested. The evidence job compares a pull request's with main's at its
      # base, so a push to main that skipped the part carries over the passing run's evidence.
      - if: steps.tested.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.tested.outputs.run }}
          NAME: evidence-${{ matrix.shard }}-${{ github.event.head_commit.tree_id }}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "$NAME" -D "$RUNNER_TEMP/evidence" || echo "no $NAME in run $RUN"
      - if: ${{ !cancelled() && (steps.scope.outputs.run == 'true' || steps.tested.outputs.passed == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.shard }}-${{ job.status == 'success' && (steps.tree.outputs.tree || github.event.head_commit.tree_id) || 'failed' }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

  # A pull request's evidence comment (web/e2e/evidence.ts): its end-to-end screenshots against
  # main's at its base, the changed ones pushed to the pr-shots branch and shown before and after,
  # and the steps driven. Runs when the end-to-end run does, on this repository's branches only:
  # it writes to the repository, which a fork's pull request must not.
  evidence:
    name: evidence
    needs: [changes, e2e]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      # The merge with main and its first parents: the base whose evidence it compares with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --filter @starbridge/web
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: ${{ runner.temp }}/pr
      - run: bun web/e2e/evidence.ts "$RUNNER_TEMP/pr" "$RUNNER_TEMP/base" "$RUNNER_TEMP/out"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The desktop app on the whole product (desktop/test/stack.ts): signs in and pairs in the app's
  # window, and answers `starbridge ask --wait` from its notifications. GitHub's runner, whatever
  # the runner variables say: Electron needs the desktop libraries the hosted image has.
  desktop-e2e:
    name: desktop end to end
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - working-directory: desktop
        run: |
          pnpm exec install-electron
          pnpm run build
      - run: .github/watchdog.sh 600 xvfb-run -a node desktop/test/stack.ts
        timeout-minutes: 11
        env:
          TMPDIR: ${{ runner.temp }}
          EVIDENCE: ${{ runner.temp }}/evidence
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-failure
          path: ${{ runner.temp }}/starbridge-desktop-failure.png
          if-no-files-found: ignore
      # The run's evidence (docs/ci.md, "Evidence"), named after the tree tested, as the web's.
      - id: tree
        if: ${{ !cancelled() }}
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-evidence-app-${{ job.status == 'success' && steps.tree.outputs.tree || 'failed' }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

  # A pull request's desktop evidence comment, as the evidence job writes the web's
  # (web/e2e/evidence.ts with CLIENT=desktop): the window's screenshots against main's.
  desktop-evidence:
    name: desktop evidence
    needs: desktop-e2e
    if: ${{ !cancelled() && needs.desktop-e2e.result != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      # The merge with main and its first parents: the base whose evidence it compares with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --filter @starbridge/web
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-evidence-*
          path: ${{ runner.temp }}/pr
      - run: bun web/e2e/evidence.ts "$RUNNER_TEMP/pr" "$RUNNER_TEMP/base" "$RUNNER_TEMP/out"
        env:
          CLIENT: desktop
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Builds the deployed images, without pushing them, when a pull request can change their base
  # images or dependencies: a change that breaks a build fails here, not at the deploy (#430).
  # Source changes outside these paths that a Dockerfile copies (docs/ for web, cli/ for the demo)
  # are not covered. On a push, deploy.yml builds and pushes them for both architectures.
  images:
    name: images
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.images == 'true') }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && vars.PR_DOCKER_RUNNER && fromJSON(vars.PR_DOCKER_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker Hub limits anonymous pulls per address, which self-hosted boxes and GitHub's
      # runners share with others; a login counts against our account instead. Forks' and
      # Dependabot's runs get no secret and pull anonymously.
      - if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      # One step each, so one broken image does not hide another. --pull as the deploy does, so a
      # stale local copy of a base image cannot pass here and fail there; Caddy's is not pulled
      # there either. No tags: jobs side by side on one box would overwrite each other's.
      - if: ${{ !cancelled() }}
        run: docker build --pull -f server/Dockerfile .
      - if: ${{ !cancelled() }}
        run: docker build --pull -f web/Dockerfile .
      - if: ${{ !cancelled() }}
        run: docker build --pull -f deploy/demo/Dockerfile .
      - if: ${{ !cancelled() }}
        run: docker build -f deploy/caddy.Dockerfile --iidfile "$RUNNER_TEMP/caddy.iid" deploy
      # Compose mounts the Caddyfile at run time, so the build above never reads it: parse it here,
      # with the rate_limit module it uses, rather than in the deploy's admin-API load (#1216). The
      # stats password it imports is written as on a host without one.
      - if: ${{ !cancelled() }}
        run: |
          sh deploy/host/caddy-auth.sh "$RUNNER_TEMP/caddy"
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$RUNNER_TEMP/caddy:/etc/caddy/secrets:ro" \
            "$(cat "$RUNNER_TEMP/caddy.iid")" caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

  # The CLI on Windows (#552), macOS (#877) and Linux ARM64 (#1481): a built binary and the whole
  # suite must pass (#884). macOS runs the launchd service and the screen readers; the release ships
  # a linux-arm64 binary. Each test file runs in its own process, two at a time (#1916), and a hung
  # one is killed and named (#834), since Bun on Windows can wedge in a test past its own timeout. GitHub's Windows, macOS and ARM runners
  # need a public repository or paid minutes, so a private repository skips the job.
  cli:
    name: CLI on ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && !github.event.repository.private && (needs.changes.result != 'success' || needs.changes.outputs.cli == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            target: bun-windows-x64
            bin: dist/starbridge.exe
          - os: macOS
            runner: macos-latest
            target: bun-darwin-arm64
            bin: dist/starbridge
          - os: Linux ARM64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            bin: dist/starbridge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - name: Build and start the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          bun build src/main.ts --compile --target="$TARGET" --outfile "$BIN"
          "./$BIN" --version
          "./$BIN" --help
      - name: The whole CLI suite
        timeout-minutes: 12
        run: bun scripts/test-each.ts

  # A pull request lists only the checks of runs its own events started, so a dispatched run's
  # checks never show on it; a commit status does. dependabot-lockfile.yml set it to pending. A
  # dispatched run runs every job, so a skipped one fails the status, except the CLI on Windows,
  # macOS and Linux ARM64, which a private repository skips.
  status:
    name: status
    needs: [changes, checks, e2e, desktop-e2e, images, cli]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          state=$(jq -r --argjson private "$PRIVATE" '
            [to_entries[] | select(.value.result != "success")
              | select((.value.result == "skipped" and $private and .key == "cli") | not)]
            | if length == 0 then "success" else "failure" end' <<<"$NEEDS")
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=CI -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
