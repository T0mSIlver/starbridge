name: CI

on:
  push:
    branches: [main]
  pull_request:
  # dependabot-lockfile.yml starts a run on a Dependabot branch after pushing its lockfile. Such
  # a run checks everything, as a push to main does, on the branch itself rather than its merge
  # with main.
  workflow_dispatch:

# A new push to a pull request cancels its older run. Main runs one at a time and never cancels
# the running one; a newer merge replaces the one waiting, so only main's head waits. deploy.yml
# deploys each run that passes, and the box refuses a revision older than the one it runs. Other
# runs, pull requests' and dispatched ones, cancel older runs for the same ref.
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# pull-requests: the changed-files step reads a pull request's files from the API.
permissions:
  contents: read
  pull-requests: read

# Jobs run on GitHub-hosted runners by default. The repository variable RUNNER points them at
# self-hosted runners instead, and DOCKER_RUNNER the image builds below.
#
# A pull request runs only the jobs its files can affect. A job that cannot be affected still
# starts and passes in seconds, so its check reports success, which a skipped workflow would
# not. Main runs everything: deploy.yml deploys once all of CI passes.
jobs:
  # One job, so the workspace installs once instead of three times.
  checks:
    name: test, typecheck, lint
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            run:
              - '**'
              - '!android/**'
              - '!.github/workflows/android.yml'
            # web's tests check it against DESIGN.md (web/scripts/tokens.ts).
            tokens:
              - 'android/app/src/main/kotlin/dev/starbridge/app/ui/theme/Tokens.kt'
      - id: scope
        run: echo "run=${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' || steps.changes.outputs.tokens == 'true' }}" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per job: runners on one machine would share ~/setup-pnpm and clobber each other.
          dest: ${{ runner.temp }}/setup-pnpm
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        # A store that stays on the runner between jobs. Its default, under the job's temp
        # folder, is emptied after each job, so every install downloaded every package.
        env:
          pnpm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
      - if: steps.scope.outputs.run == 'true'
        run: pnpm lint
      - if: steps.scope.outputs.run == 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.run == 'true'
        run: pnpm test

  # The whole product on one machine (web/e2e/run.ts). Each screenshot also fails on layout
  # breakage: a page wider than the window, clipped, spilled or overlapping text (web/e2e/layout.ts).
  e2e:
    name: end to end
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    # actions: the tested step lists artifacts.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # Not affected: the Android app, the evals, and Markdown no page renders. /docs renders
      # docs/*.md, cli/README.md and server/README.md (web/src/lib/docs.ts).
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!android/**'
              - '!.github/workflows/android.yml'
              - '!evals/**'
              - '!**/*.md'
            pages:
              - 'docs/*.md'
              - 'cli/README.md'
              - 'server/README.md'
      # A merge to main skips the run when a run of this workflow already passed on the same tree
      # (#878): most often the pull request's own last run, on its merge with the main commit it
      # was then merged onto, since a squash merge of an unchanged base yields the same tree. A
      # tree holds every file, ci.yml included, so the run that passed tested exactly what main
      # now holds, with the same steps. Each passing run uploads an artifact named after its tree.
      # Only this repository's branches count: a fork's pull request runs its own ci.yml and could
      # upload any name. Anything else, an expired artifact or a failed API call, runs it again.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        # Not gh: some self-hosted runners lack it (dell2-2).
        run: |
          n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-passed-$TREE&per_page=100" |
            jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length') || n=0
          echo "passed=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: scope
        run: echo "run=${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.tested.outputs.passed != 'true') || steps.changes.outputs.code == 'true' || steps.changes.outputs.pages == 'true' }}" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # No package-manager-cache: it uploaded the pnpm store to GitHub's cache after every run,
      # ~50 s of the job, while the store already stays on the runner.
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        env:
          pnpm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
      - if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @starbridge/web exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} firefox
        timeout-minutes: 5
      # Next's build cache (compiled modules, TypeScript's build info) stays on the runner, which
      # takes ~25 s off the build. The checkout deletes web/.next, not the folder it links to.
      - if: steps.scope.outputs.run == 'true' && runner.environment == 'self-hosted'
        run: |
          cache=$RUNNER_TOOL_CACHE/next-cache
          if [ -d "$cache" ] && [ "$(du -sm "$cache" | cut -f1)" -gt 2048 ]; then rm -rf "$cache"; fi
          mkdir -p "$cache" web/.next
          ln -sfn "$cache" web/.next/cache
      # A run takes ~5 min. At 10 the watchdog prints what is still running and stops it.
      - if: steps.scope.outputs.run == 'true'
        run: .github/watchdog.sh 600 xvfb-run -a node web/e2e/run.ts
        timeout-minutes: 11
        env:
          TMPDIR: ${{ runner.temp }}
      # What a later merge of the same tree looks up (the tested step above). It holds the commit
      # that passed; overwrite, since a re-run attempt uploads it again.
      - id: tree
        if: steps.scope.outputs.run == 'true'
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/e2e-passed"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-passed-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/e2e-passed
          retention-days: 7
          overwrite: true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure
          path: ${{ runner.temp }}/starbridge-e2e-failure.png
          if-no-files-found: ignore

  # Builds the deployed images, without pushing them, when a pull request can change their base
  # images or dependencies: a change that breaks a build fails here, not at the deploy (#430).
  # Source changes outside these paths that a Dockerfile copies (docs/ for web, cli/ for the demo)
  # are not covered. On a push, main's deploy builds them on the server. Set
  # DOCKER_RUNNER when RUNNER's runners have no Docker: a gate on the usual runners picks one of
  # its runners only when there is something to build, so main's CI never waits on them.
  images-scope:
    name: images scope
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      build: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.images == 'true' }}
    steps:
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            images:
              - '**/Dockerfile'
              - '**/*.Dockerfile'
              - '.dockerignore'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'deploy/compose.yaml'
              - 'deploy/demo/**'
              - '.github/workflows/ci.yml'

  images:
    name: images
    needs: images-scope
    runs-on: ${{ needs.images-scope.outputs.build == 'true' && vars.DOCKER_RUNNER || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      BUILD: ${{ needs.images-scope.outputs.build }}
      # Tagged per run, so runs on one host never share a tag; removed after.
      TAG: ci-${{ github.run_id }}
    steps:
      - if: env.BUILD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One step each, so one broken image does not hide another. --pull as the deploy does, so a
      # stale local copy of a base image cannot pass here and fail there; Caddy's is not pulled
      # there either.
      - if: env.BUILD == 'true' && !cancelled()
        run: docker build --pull -f server/Dockerfile -t starbridge-server:$TAG .
      - if: env.BUILD == 'true' && !cancelled()
        run: docker build --pull -f web/Dockerfile -t starbridge-web:$TAG .
      - if: env.BUILD == 'true' && !cancelled()
        run: docker build --pull -f deploy/demo/Dockerfile -t starbridge-demo:$TAG .
      - if: env.BUILD == 'true' && !cancelled()
        run: docker build -f deploy/caddy.Dockerfile -t starbridge-caddy:$TAG deploy
      # A self-hosted runner's disk may be shared with other work: keep the build cache to 3 GB, as
      # deploy/host/apply.sh does on the server. BuildKit keeps records a running build uses.
      - if: always() && env.BUILD == 'true'
        run: |
          docker image rm -f starbridge-server:$TAG starbridge-web:$TAG starbridge-demo:$TAG starbridge-caddy:$TAG >/dev/null 2>&1 || true
          docker builder prune -f --keep-storage 3GB >/dev/null || true

  # The CLI on Windows (#552): its platform tests and a built binary must pass. The rest of the
  # suite runs too but cannot fail the job until it passes there. Bun on Windows can wedge in a
  # test past its own timeout, so each file runs alone and a hung one is killed and named (#834).
  # GitHub's Windows runners need a public repository or paid minutes, so a private repository
  # skips the job.
  windows:
    name: CLI on Windows
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: bun test test/platform.test.ts
      - name: Build and start the binary
        run: |
          bun build src/main.ts --compile --target=bun-windows-x64 --outfile dist/starbridge.exe
          ./dist/starbridge.exe --version
          ./dist/starbridge.exe --help
      - name: The whole CLI suite
        continue-on-error: true
        timeout-minutes: 12
        run: bun scripts/test-each.ts

  # A pull request lists only the checks of runs its own events started, so a dispatched run's
  # checks never show on it; a commit status does. dependabot-lockfile.yml set it to pending.
  status:
    name: status
    needs: [checks, e2e, images-scope, images]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) && 'failure' || 'success' }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=CI -f state="$STATE"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
