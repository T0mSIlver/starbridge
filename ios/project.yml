# The iPhone app's Xcode project: `xcodegen` writes Starbridge.xcodeproj from this file, which is
# what to edit. README.md says how to build and test.
name: Starbridge
options:
  bundleIdPrefix: dev.starbridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 3N63N7U9R3
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # What Settings shows. MARKETING_VERSION stays numeric for Apple, so the release build passes the
    # whole tag here, release candidate suffix included (#1892).
    STARBRIDGE_VERSION: $(MARKETING_VERSION)
    CURRENT_PROJECT_VERSION: "1"
packages:
  StarbridgeProtocol:
    path: StarbridgeProtocol
targets:
  Starbridge:
    type: application
    platform: iOS
    sources:
      - Starbridge
    dependencies:
      - package: StarbridgeProtocol
      - target: StarbridgeNotifications
    entitlements:
      path: Starbridge/Starbridge.entitlements
      properties:
        aps-environment: development
        # Shared with the extension: the saved state's file, and the keychain item, since an app
        # group name is also a keychain access group.
        com.apple.security.application-groups:
          - group.dev.starbridge.ios
        # starbridge.run's apple-app-site-association: the browser sheet ends GitHub's sign-in on
        # its https callback (#1115), and the callback opens the app from Safari.
        com.apple.developer.associated-domains:
          - applinks:starbridge.run
          - webcredentials:starbridge.run
        # Sign in with Apple (#1411), which App Store guideline 4.8 asks of an app that signs in
        # with GitHub.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.starbridge.ios
        PRODUCT_NAME: Starbridge
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Starbridge/Info.plist
      properties:
        CFBundleDisplayName: Starbridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        StarbridgeVersion: $(STARBRIDGE_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # A background push says a question was answered elsewhere, so its notification goes; a
        # background refresh sends the answers left in the outbox (#1392).
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.starbridge.ios.answers
        NSCameraUsageDescription: Starbridge scans the QR code that your other device shows, to add this iPhone to your account.
        # GitHub sign-in comes back on starbridge://auth (PROTOCOL.md, "Auth").
        CFBundleURLTypes:
          - CFBundleURLName: dev.starbridge.ios
            CFBundleURLSchemes:
              - starbridge
  # Opens each push's sealed box and replaces the placeholder (#1137).
  StarbridgeNotifications:
    type: app-extension
    platform: iOS
    sources:
      - Notifications
      - Starbridge/Data/Saved.swift
      - Starbridge/Data/Vault.swift
      - Starbridge/Data/Api.swift
      - Starbridge/Data/Inbox.swift
      - Starbridge/Data/Notify.swift
    dependencies:
      - package: StarbridgeProtocol
    entitlements:
      path: Notifications/StarbridgeNotifications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.starbridge.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.starbridge.ios.notifications
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Starbridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  StarbridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StarbridgeTests
    dependencies:
      - target: Starbridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.starbridge.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Starbridge.app/Starbridge
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Starbridge:
    build:
      targets:
        Starbridge: all
        StarbridgeTests: [test]
    test:
      targets:
        - StarbridgeTests
