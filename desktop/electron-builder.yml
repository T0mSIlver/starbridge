# Packages the app: `pnpm --filter @starbridge/desktop dist` on a Mac.
appId: dev.starbridge.desktop
productName: Starbridge
copyright: Copyright © 2026 Tom Vaucourt
directories:
  output: release
  buildResources: build
# main.js and the preloads are bundled, so the app needs no node_modules.
files:
  - dist/**
  - assets/**
  - package.json
protocols:
  - name: Starbridge
    schemes: [starbridge]
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # The zip, which updates download; the DMG has its own name below.
  artifactName: Starbridge-${version}-${arch}-mac.${ext}
  # Signed with the Developer ID in CSC_LINK and notarized by the release workflow; the desktop
  # workflow's builds are ad hoc (`-c.mac.identity=-`).
  hardenedRuntime: true
  # The widget's helper, which scripts/widgets.cjs signs with its App Group entitlement.
  signIgnore:
    - Contents/MacOS/starbridge-widgets$
  extendInfo:
    # Notifications as alerts, so their buttons show without a hover.
    NSUserNotificationAlertStyle: alert
# The DMG window (#972): the app, an arrow and Applications, on build/background.png (and @2x,
# which electron-builder joins into one Retina TIFF). Its size is the window's.
# scripts/dmg-hidden.cjs puts the background and volume icon files outside the window.
dmg:
  artifactName: Starbridge-${version}-${arch}.dmg
  iconSize: 128
  iconTextSize: 13
  contents:
    - { x: 170, y: 190, type: file }
    - { x: 470, y: 190, type: link, path: /Applications }
afterPack: scripts/after-pack.cjs
# Writes latest-mac.yml, which the app reads from the latest GitHub Release to update. The
# workflows upload the files themselves (`--publish never`).
publish:
  provider: github
  owner: T0mSIlver
  repo: starbridge
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
linux:
  executableName: starbridge
