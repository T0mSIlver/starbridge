<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Server</title>
<link rel="stylesheet" href="server.css">
</head>
<body>
<form id="form">
  <label for="url">Server</label>
  <input id="url" type="url" required spellcheck="false" autocomplete="off">
  <p id="note">Starbridge restarts on the new server, where you sign in and pair again.</p>
  <div class="row">
    <button type="button" id="default">Use starbridge.run</button>
    <button type="submit">Save</button>
  </div>
</form>
<script src="server.js"></script>
</body>
</html>
