<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <title>Starbridge</title>
  <!-- The mark as the page draws it (Mark in components/icons.tsx): `fg` and `accent` of the
       browser's scheme, so the tab shows the same icon as the page on a light or a dark strip. -->
  <style>
    .fg { fill: #121212 } .accent { fill: #965700 }
    @media (prefers-color-scheme: dark) { .fg { fill: #f1f1f1 } .accent { fill: #f5a83b } }
  </style>
  <circle class="fg" cx="54" cy="148" r="80"/>
  <rect class="fg" x="51.75" y="18" width="4.5" height="52"/>
  <rect class="accent" x="48.5" y="34" width="11" height="20" rx="5.5"/>
</svg>
