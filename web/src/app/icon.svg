<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <title>Starbridge</title>
  <!-- The mark as the page draws it (Mark in components/icons.tsx), in `fg` and `accent` of the
       system's scheme. A thin halo in the other scheme's `fg` keeps it legible on a tab strip that
       does not follow the system, such as a dark browser theme on a light system. -->
  <style>
    g { stroke: #f1f1f1; stroke-width: 5; paint-order: stroke }
    .fg { fill: #121212 } .accent { fill: #965700 }
    @media (prefers-color-scheme: dark) {
      g { stroke: #121212 } .fg { fill: #f1f1f1 } .accent { fill: #f5a83b }
    }
  </style>
  <g>
    <circle class="fg" cx="54" cy="148" r="80"/>
    <rect class="fg" x="51.75" y="18" width="4.5" height="52"/>
    <rect class="accent" x="48.5" y="34" width="11" height="20" rx="5.5"/>
  </g>
</svg>
