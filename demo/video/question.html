<!doctype html>
<!-- The image the demo's question carries: the eval on a sample, and what the full run costs. 1200×400. -->
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Google Sans Flex";
    src: url("../../web/src/fonts/google-sans-flex-latin-wght-normal.woff2");

  }
  body {
    margin: 0;
    width: 1200px;
    height: 400px;
