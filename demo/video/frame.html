<!doctype html>
<!--
  One frame of the demo video at 1920×1080: one or two agents' terminals, a hole where compose.ts
  lays the recording (a phone, or a browser on the web inbox), a caption, and the end card.
  compose.ts calls layout(hole, terminals) once, then render(t, take) for each frame, take being
  a take's events.json.
-->
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Google Sans Flex";
    src: url("../../web/src/fonts/google-sans-flex-latin-wght-normal.woff2");
    font-weight: 100 1000;
  }
  @font-face {
    font-family: "Google Sans Code";
    src: url("../../web/src/fonts/google-sans-code-latin-wght-normal.woff2");
    font-weight: 300 800;
  }
  :root {
    --bg: #0c0c0c;
    --surface: #171717;
    --line: #2a2a2a;
    --fg: #f1f1f1;
    --fg2: #a3a3a3;
    --fg3: #6a6a6a;
    --accent: #f5a83b;
    --ok: #7fbf7f;
  }
  html, body { margin: 0; background: transparent; }
  body { width: 1920px; height: 1080px; position: relative; overflow: hidden; color: var(--fg); font-family: "Google Sans Flex", sans-serif; }
  /* Everything outside the phone's screen: a rounded hole by a spread shadow. */
  .hole { position: absolute; box-shadow: 0 0 0 3000px var(--bg); }
  .bezel { position: absolute; border: 2px solid #333; box-shadow: inset 0 0 0 8px #050505; }
  .term {
    position: absolute; box-sizing: border-box;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  }
  .bar { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--line); color: var(--fg3); font-size: 22px; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; background: #333; display: inline-block; }
  .bar span { margin-left: 14px; }
  .screen {
    position: absolute; left: 0; right: 0; bottom: 0; top: 57px; padding: 20px 30px; box-sizing: border-box;
    font: var(--size, 27px)/1.45 "Google Sans Code", monospace; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
  }
  .l { white-space: pre-wrap; padding-left: 34px; text-indent: -34px; }
  .gap { height: 14px; }
  .user { color: var(--fg2); }
  .user b { color: var(--fg); font-weight: 400; }
  .dot { color: var(--fg); }
  .dot.tool { color: var(--ok); }
  .dot.wait { color: var(--accent); }
  .tool b { font-weight: 700; color: var(--fg); }
  .sub { color: var(--fg2); padding-left: 68px; text-indent: -34px; }
  .answer { color: var(--accent); }
  .cmd { color: var(--fg2); }
  .caption {
    position: absolute; text-align: center; font-size: 40px; font-weight: 500;
    letter-spacing: -0.2px; transition: none;
  }
  .end {
    position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
  }
  /* The lockup (DESIGN.md): the name's baseline on the mark's bottom edge, a gap of 0.4 × the mark. */
  .end .name { display: flex; align-items: baseline; gap: 44px; font-size: 96px; font-weight: 500; }
  .end .url { font-size: 40px; color: var(--fg); }
  .end .gh { font: 30px "Google Sans Code", monospace; color: var(--fg2); }
  .end .agents { font-size: 28px; color: var(--fg3); }
</style>
<div class="hole" id="hole"></div>
<div class="bezel" id="bezel"></div>
<div id="terms"></div>
<div class="caption" id="caption"></div>
<div class="end" id="end">
  <div class="name">
    <svg width="110" height="110" viewBox="18 18 72 72" aria-hidden="true">
      <circle fill="#f1f1f1" cx="54" cy="148" r="80" />
      <rect fill="#f1f1f1" x="51.75" y="18" width="4.5" height="52" />
      <rect fill="#f5a83b" x="48.5" y="34" width="11" height="20" rx="5.5" />
    </svg>
    Starbridge
  </div>
  <div class="url">starbridge.run</div>
  <div class="gh">github.com/T0mSIlver/starbridge</div>
  <div class="agents">Claude Code · Codex · Pi · opencode · MIT</div>
</div>
<script>
  const SPINNER = ["·", "✢", "✳", "✶", "✻", "✽"];
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  /**
   * Places the recording's hole (rounded like a phone or a browser window), the terminals and the
   * caption; compose.ts lays the recording at the hole's rectangle.
   */
  window.layout = ({ hole, terminals, caption }) => {
    for (const [id, pad] of [["hole", 0], ["bezel", 10]]) {
      Object.assign(document.getElementById(id).style, {
        left: `${hole.x - pad}px`, top: `${hole.y - pad}px`,
        width: `${hole.w + 2 * pad - (pad ? 4 : 0)}px`, height: `${hole.h + 2 * pad - (pad ? 4 : 0)}px`,
        borderRadius: `${hole.r + pad}px`,
      });
    }
    document.getElementById("terms").innerHTML = terminals
      .map((r) => `<div class="term" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;--size:${r.size}px">
        <div class="bar"><i></i><i></i><i></i><span></span></div><div class="screen"></div></div>`)
      .join("");
    Object.assign(document.getElementById("caption").style, {
      left: `${caption.x}px`, width: `${caption.w}px`, top: `${caption.y}px`,
    });
  };

  /** How each agent prints: Claude Code's ⏺ and ⎿, Codex's • and └. */
  const SKINS = {
    "claude-code": { name: "claude", user: "&gt;", text: "⏺", tool: "⏺", out: "⎿", shell: (c) => `<b>Bash</b>(<span class="cmd">${c}</span>)` },
    codex: { name: "codex", user: "›", text: "•", tool: "•", out: "└", shell: (c) => `<b>Ran</b> <span class="cmd">${c}</span>` },
  };

  /** A terminal's lines at time t: the scripted agent around the real CLI's input and output. */
  function lines(t, pane) {
    const k = SKINS[pane.agent];
    const q = pane.question;
    const out = [];
    const at = (time, html) => { if (time !== undefined && t >= time) out.push(html); };
    const typed = (time, text, cps = 90) => esc(text.slice(0, Math.max(0, Math.floor((t - time) * cps))));
    const gap = (time) => at(time, `<div class="gap"></div>`);
    const tool = (time, html) => at(time, `<div class="l"><span class="dot tool">${k.tool}</span> <span class="tool">${html}</span></div>`);
    const said = (time, text) => at(time, `<div class="l"><span class="dot">${k.text}</span> ${typed(time, text)}</div>`);
    at(0, `<div class="l user">${k.user} <b>${esc(pane.prompt)}</b></div>`);
    gap(0);
    tool(0, `<b>${pane.tool[0]}</b>(${esc(pane.tool[1])})`);
    at(0, `<div class="l sub">${k.out}  ${esc(pane.tool[2])}</div>`);
    gap(0.6);
    said(0.6, pane.why);
    const askAt = pane.asked - 0.4;
    gap(askAt);
    const image = pane.image ? ` --image ${esc(pane.image)}` : "";
    tool(askAt, k.shell(`starbridge ask --question "${esc(q.question)}"${image} ${q.options.map((o) => `--option "${esc(o)}"`).join(" ")} --waiting --wait`));
    if (t >= askAt && !(t >= pane.answered)) {
      const s = SPINNER[Math.floor(t * 8) % SPINNER.length];
      out.push(`<div class="l sub"><span class="answer">${s}</span> Waiting for your answer… ${Math.floor(t - askAt)}s</div>`);
    }
    // The CLI's answer line, its choice in amber.
    const line = pane.answer.split("\n").at(-1);
    const cut = line.lastIndexOf(": ") + 2;
    at(pane.answered, `<div class="l sub">${k.out}  ${esc(line.slice(0, cut))}<span class="answer">${esc(line.slice(cut))}</span></div>`);
    gap(pane.answered + 0.5);
    said(pane.answered + 0.5, pane.next);
    if (pane.run) {
      gap(pane.running);
      tool(pane.running, k.shell(`starbridge run --title "${esc(pane.run.title)}" --reason "${esc(pane.run.reason)}" -- ${esc(pane.run.command)}`));
      for (const [i, l] of pane.lines.entries())
        at(l.t, `<div class="l sub">${i === 0 ? `${k.out}  ` : "   "}${esc(l.text)}</div>`);
    }
    const doneAt = (pane.run ? pane.ran : pane.answered + 0.5 + pane.next.length / 90) + 0.6;
    gap(doneAt);
    said(doneAt, pane.done);
    return out.join("");
  }

  window.render = (t, take) => {
    document.getElementById("end").style.display = t < take.end ? "none" : "flex";
    const terms = document.querySelectorAll(".term");
    take.panes.forEach((pane, i) => {
      terms[i].querySelector(".bar span").textContent = `${pane.project} — ${SKINS[pane.agent].name} — ${pane.machine}`;
      terms[i].querySelector(".screen").innerHTML = lines(t, pane);
    });
    const cap = take.captions.find(([a, b]) => t >= a && t < b);
    const el = document.getElementById("caption");
    el.textContent = cap ? cap[2] : "";
    // 150 ms fades at both ends.
    el.style.opacity = cap ? String(Math.min(1, (t - cap[0]) / 0.15, (cap[1] - t) / 0.15)) : "0";
  };
</script>
