<!doctype html>
<!--
  One frame of the demo video at 1920×1080: the agent's terminal on the left, a hole on the right
  where compose.ts lays the phone recording, a caption, and the end card. compose.ts calls
  render(t, take) for each frame, take being a take's events.json.
-->
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Google Sans Flex";
    src: url("../../web/src/fonts/google-sans-flex-latin-wght-normal.woff2");
    font-weight: 100 1000;
  }
  @font-face {
    font-family: "Google Sans Code";
    src: url("../../web/src/fonts/google-sans-code-latin-wght-normal.woff2");
    font-weight: 300 800;
  }
  :root {
    --bg: #0c0c0c;
    --surface: #171717;
    --line: #2a2a2a;
    --fg: #f1f1f1;
    --fg2: #a3a3a3;
    --fg3: #6a6a6a;
    --accent: #f5a83b;
    --ok: #7fbf7f;
  }
  html, body { margin: 0; background: transparent; }
  body { width: 1920px; height: 1080px; position: relative; overflow: hidden; color: var(--fg); font-family: "Google Sans Flex", sans-serif; }
  /* Everything outside the phone's screen: a rounded hole by a spread shadow. */
  .hole { position: absolute; border-radius: 48px; box-shadow: 0 0 0 3000px var(--bg); }
  .bezel { position: absolute; border-radius: 56px; border: 2px solid #333; box-shadow: inset 0 0 0 8px #050505; }
  .term {
    position: absolute; left: 80px; top: 60px; width: 1240px; height: 880px; box-sizing: border-box;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  }
  .bar { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--line); color: var(--fg3); font-size: 22px; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; background: #333; display: inline-block; }
  .bar span { margin-left: 14px; }
  .screen {
    position: absolute; left: 0; right: 0; bottom: 0; top: 57px; padding: 20px 30px; box-sizing: border-box;
    font: 27px/1.45 "Google Sans Code", monospace; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .l { white-space: pre-wrap; padding-left: 34px; text-indent: -34px; }
  .gap { height: 14px; }
  .user { color: var(--fg2); }
  .user b { color: var(--fg); font-weight: 400; }
  .dot { color: var(--fg); }
  .dot.tool { color: var(--ok); }
  .dot.wait { color: var(--accent); }
  .tool b { font-weight: 700; color: var(--fg); }
  .sub { color: var(--fg2); padding-left: 68px; text-indent: -34px; }
  .answer { color: var(--accent); }
  .cmd { color: var(--fg2); }
  .caption {
    position: absolute; left: 80px; width: 1240px; top: 972px; text-align: center; font-size: 40px; font-weight: 500;
    letter-spacing: -0.2px; transition: none;
  }
  .end {
    position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
  }
  .end .name { display: flex; align-items: center; gap: 28px; font-size: 96px; font-weight: 600; letter-spacing: -2px; }
  .end .url { font-size: 40px; color: var(--fg); }
  .end .gh { font: 30px "Google Sans Code", monospace; color: var(--fg2); }
  .end .agents { font-size: 28px; color: var(--fg3); }
</style>
<div class="hole" id="hole"></div>
<div class="bezel" id="bezel"></div>
<div class="term">
  <div class="bar"><i></i><i></i><i></i><span>billing-api — claude — workstation</span></div>
  <div class="screen" id="screen"></div>
</div>
<div class="caption" id="caption"></div>
<div class="end" id="end">
  <div class="name">
    <svg width="120" height="120" viewBox="18 18 72 72" aria-hidden="true">
      <circle fill="#f1f1f1" cx="54" cy="148" r="80" />
      <rect fill="#f1f1f1" x="51.75" y="18" width="4.5" height="52" />
      <rect fill="#f5a83b" x="48.5" y="34" width="11" height="20" rx="5.5" />
    </svg>
    Starbridge
  </div>
  <div class="url">starbridge.run</div>
  <div class="gh">github.com/T0mSIlver/starbridge</div>
  <div class="agents">Claude Code · Codex · Pi · opencode · MIT</div>
</div>
<script>
  const SPINNER = ["·", "✢", "✳", "✶", "✻", "✽"];
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  /** Places the phone's hole; compose.ts lays the recording at the same rectangle. */
  window.layout = (phone) => {
    for (const [id, pad] of [["hole", 0], ["bezel", 10]]) {
      const el = document.getElementById(id);
      Object.assign(el.style, {
        left: `${phone.x - pad}px`, top: `${phone.y - pad}px`,
        width: `${phone.w + 2 * pad - (pad ? 4 : 0)}px`, height: `${phone.h + 2 * pad - (pad ? 4 : 0)}px`,
      });
    }
  };

  /** The terminal's lines at time t: the scripted agent around the real CLI's input and output. */
  function lines(t, take) {
    const e = take.events;
    const q = take.question;
    const out = [];
    const at = (time, html) => { if (t >= time) out.push(html); };
    const typed = (time, text, cps = 90) => esc(text.slice(0, Math.max(0, Math.floor((t - time) * cps))));
    at(0, `<div class="l user">&gt; <b>Retire the legacy pricing tiers in billing-api.</b></div>`);
    at(0, `<div class="gap"></div>`);
    at(0, `<div class="l"><span class="dot tool">⏺</span> <span class="tool"><b>Read</b>(src/plans/tiers.ts)</span></div>`);
    at(0, `<div class="l sub">⎿  Read 84 lines</div>`);
    at(0.6, `<div class="gap"></div>`);
    at(0.6, `<div class="l"><span class="dot">⏺</span> ${typed(0.6, "1,284 plans are still on the two legacy tiers. Where they go is a pricing call, so I'm asking.")}</div>`);
    const askAt = e.ask - 0.4;
    at(askAt, `<div class="gap"></div>`);
    at(askAt, `<div class="l"><span class="dot tool">⏺</span> <span class="tool"><b>Bash</b>(<span class="cmd">starbridge ask --question "${esc(q.question)}" --image tiers.png ${q.options.map((o) => `--option "${esc(o)}"`).join(" ")} --waiting --wait</span>)</span></div>`);
    if (t >= askAt && t < e.answered) {
      const s = SPINNER[Math.floor(t * 8) % SPINNER.length];
      out.push(`<div class="l sub"><span class="answer">${s}</span> Waiting for your answer… ${Math.floor(t - askAt)}s</div>`);
    }
    // The CLI's answer line, its choice in amber.
    const said = take.answer.split("\n").at(-1);
    const cut = said.lastIndexOf(": ") + 2;
    at(e.answered, `<div class="l sub">⎿  ${esc(said.slice(0, cut))}<span class="answer">${esc(said.slice(cut))}</span></div>`);
    at(e.answered + 0.5, `<div class="gap"></div>`);
    at(e.answered + 0.5, `<div class="l"><span class="dot">⏺</span> ${typed(e.answered + 0.5, "Mapping both legacy tiers to Standard, then running the tests.")}</div>`);
    at(e.run, `<div class="gap"></div>`);
    at(e.run, `<div class="l"><span class="dot tool">⏺</span> <span class="tool"><b>Bash</b>(<span class="cmd">starbridge run --title "${esc(take.run.title)}" --reason "${esc(take.run.reason)}" -- pnpm test</span>)</span></div>`);
    for (const [i, line] of take.lines.entries())
      at(line.t, `<div class="l sub">${i === 0 ? "⎿  " : "   "}${esc(line.text)}</div>`);
    at(e.ran + 0.6, `<div class="gap"></div>`);
    at(e.ran + 0.6, `<div class="l"><span class="dot">⏺</span> ${typed(e.ran + 0.6, "Done. Legacy tiers map to Standard at the same price; all 4 suites pass.")}</div>`);
    return out.join("");
  }

  const CAPTIONS = (e) => [
    [0, e.notified, "Your agent needs a decision. You're away from your desk."],
    [e.notified, e.tapped, "It asks on your phone."],
    [e.tapped, e.run, "One tap. The answer goes back into the session."],
    [e.run, e.end, "Runs show their progress there too."],
  ];

  window.render = (t, take) => {
    const e = take.events;
    document.getElementById("end").style.display = t < e.end ? "none" : "flex";
    document.getElementById("screen").innerHTML = lines(t, take);
    const cap = CAPTIONS(e).find(([a, b]) => t >= a && t < b);
    const el = document.getElementById("caption");
    el.textContent = cap ? cap[2] : "";
    // 150 ms fades at both ends.
    el.style.opacity = cap ? String(Math.min(1, (t - cap[0]) / 0.15, (cap[1] - t) / 0.15)) : "0";
  };
</script>
