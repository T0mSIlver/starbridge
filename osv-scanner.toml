[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2027-01-13
reason = "sprintf-js (no fixed version) comes only from the optional roarr, pulled by global-agent and @electron/get for Electron's build-time binary download; it ships in no runtime and roarr formats only its own log strings (#1554)."

[[IgnoredVulns]]
id = "GHSA-r937-wjx7-w2jp"
ignoreUntil = 2027-01-19
reason = "kotlin-gradle-plugin 2.4.10 is the one Gradle 9.8.1 embeds for buildSrc, and 2.2.10 is only read as AGP's dependency metadata (the build resolves 2.4.21); the fix is in 2.4.20, so it goes when a Gradle release embeds that. Build-time only, ships in no APK; the flaw is unsafe deserialization of KAPT's incremental cache (fix commit bf51df6, KT-86604), and the app runs KSP, never KAPT (#2068, #2088)."
