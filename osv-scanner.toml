reason = "kotlin-gradle-plugin 2.4.10 is the one Gradle 9.8.1 embeds for buildSrc, and 2.2.10 is only read as AGP's dependency metadata (the build resolves 2.4.21); the fix is in 2.4.20, so it goes when a Gradle release embeds that. Build-time only, ships in no APK; the flaw is unsafe deserialization of Gradle build cache metadata, which needs write access to a cache the build reads (#2068)."
